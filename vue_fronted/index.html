<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/logo.svg">
    <script>
      // 主题检测 — 必须在任何渲染之前执行
      (function(){
        var t = 'dark';
        try { t = localStorage.getItem('jnao_theme') || 'dark'; } catch(e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
      const coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)')
  || CSS.supports('top: constant(a)'))
      document.write(
        `<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0${
  coverSupport ? ', viewport-fit=cover' : ''}" />`)
    </script>
    <title></title>
    <!--preload-links-->
    <link rel="preload" href="/static/teacher.png" as="image" />
    <link rel="preload" href="/static/teacher-avatar.png" as="image" />
    <!--app-context-->
    <style>
      /* ===== Theme CSS Variables ===== */
      :root, [data-theme="dark"] {
        --bg: #070b14; --bg-card: #0f1a2e; --bg-input: #0d1525;
        --text: #ffffff; --text-sub: #cbd5e1; --text-dim: #94a3b8; --text-hint: #475569;
        --accent: #3b82f6; --accent-bg: rgba(59,130,246,0.15);
        --gold: #f5c842; --gold-bg: rgba(245,200,66,0.12);
        --green: #22c55e; --green-bg: rgba(34,197,94,0.15);
        --border: rgba(59,130,246,0.2); --chat-ai-bg: #0f2142; --chat-me-bg: #151e30;
        --nav-bg: #0a0f1c; --nav-border: rgba(59,130,246,0.15);
        --focus-bg: linear-gradient(135deg,#0c1d3d 0%,#0a1830 50%,#0d1b3a 100%);
        --card-glow: 0 0 20px rgba(59,130,246,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
        --mic-shadow: rgba(59,130,246,0.4);
        --chat-surface: linear-gradient(180deg, rgba(59,130,246,0.03) 0%, var(--bg) 48%);
        --bubble-shadow: 0 2px 8px rgba(0,0,0,0.3);
        --splash-bg: #070b14; --splash-text: #ffffff; --splash-sub: #94a3b8;
      }
      [data-theme="white"] {
        --bg: #f0f2f5; --bg-card: #ffffff; --bg-input: #f5f5f5;
        --text: #1a1a2e; --text-sub: #333; --text-dim: #6b7280; --text-hint: #9ca3af;
        --accent: #2563eb; --accent-bg: rgba(37,99,235,0.08);
        --gold: #d97706; --gold-bg: rgba(217,119,6,0.08);
        --green: #16a34a; --green-bg: rgba(22,163,74,0.08);
        --border: #e5e7eb; --chat-ai-bg: #eff6ff; --chat-me-bg: #f3f4f6;
        --nav-bg: #ffffff; --nav-border: #e5e7eb;
        --focus-bg: linear-gradient(135deg,#1e3a5f,#2563eb);
        --card-glow: 0 2px 12px rgba(0,0,0,0.06);
        --mic-shadow: rgba(37,99,235,0.25);
        --chat-surface: linear-gradient(180deg, #f8fafc 0%, var(--bg) 40%);
        --bubble-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(37,99,235,0.06);
        --splash-bg: #ffffff; --splash-text: #1a1a2e; --splash-sub: #6b7280;
      }
    </style>
  </head>
  <body>
    <!-- Splash -->
    <div id="initial-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,PingFang SC,sans-serif;">
      <div style="display:flex;align-items:baseline;gap:12px;transform:translateY(-8vh);">
        <span id="splash-logo" style="font-size:48px;font-weight:700;letter-spacing:.04em;animation:jr 0.6s 0.1s cubic-bezier(.22,.61,.36,1) both,jn 0.5s 0.9s cubic-bezier(.34,1.56,.64,1) both;">
          <span style="color:#dc2626">J</span><span id="splash-nao">nao</span>
        </span>
        <span id="splash-ai" style="font-size:48px;font-weight:700;letter-spacing:.04em;animation:as 0.5s 0.9s cubic-bezier(.34,1.56,.64,1) both;">AI</span>
      </div>
      <span id="splash-tag" style="margin-top:16px;font-size:13px;letter-spacing:.08em;animation:fu 0.7s 0.5s ease-out both;">劲脑 · 智能工作台</span>
      <style>
        @keyframes jr { from{opacity:0;transform:scale(.6)} to{opacity:1;transform:scale(1)} }
        @keyframes jn { 0%{transform:translateX(0)} 30%{transform:translateX(-12px)} 100%{transform:translateX(-4px)} }
        @keyframes as { from{opacity:0;transform:translateX(50px)} 60%{opacity:1;transform:translateX(-3px)} to{opacity:1;transform:translateX(0)} }
        @keyframes fu { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      </style>
    </div>
    <script>
      // Splash — 2分钟内回来走 bfcache 不展示；同一会话只展示一次
      (function(){
        var s = document.getElementById('initial-splash');
        var ACTIVE_KEY = 'jnao_last_active';
        var SESSION_KEY = 'jnao_splash_session';
        var TTL = 2 * 60 * 1000; // 2 分钟
        var now = Date.now();
        // 同会话已展示 → 跳过
        try { if (sessionStorage.getItem(SESSION_KEY)) { s.remove(); return; } } catch(e) {}
        var last = 0;
        try { last = parseInt(localStorage.getItem(ACTIVE_KEY) || '0', 10); } catch(e) {}
        try { localStorage.setItem(ACTIVE_KEY, String(now)); } catch(e) {}
        try { sessionStorage.setItem(SESSION_KEY, '1'); } catch(e) {}
        if (last && (now - last) < TTL) { s.remove(); return; }
        var delay = 2500;

        // 适配主题
        var isLight = document.documentElement.getAttribute('data-theme') === 'white';
        s.style.background = isLight ? '#ffffff' : '#0d1117';
        document.getElementById('splash-nao').style.color = isLight ? '#1a1a2e' : '#e6edf3';
        document.getElementById('splash-ai').style.color = isLight ? '#1a1a2e' : '#e6edf3';
        document.getElementById('splash-tag').style.color = isLight ? '#6b7280' : '#8b949e';

        setTimeout(function(){
          s.style.transition = 'opacity 0.3s';
          s.style.opacity = '0';
          setTimeout(function(){ s.remove(); }, 300);
        }, delay);
      })();
    </script>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
