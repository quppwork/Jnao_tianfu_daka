<style>
  body{background:#0B0E14}
  /* ===== 顶部：幕海报横滑（滑动选幕）===== */
  .banner{display:flex;margin:14px 18px 0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px}
  .banner::-webkit-scrollbar{display:none}
  .bslide{flex:none;width:100%;scroll-snap-align:center;position:relative;border:1.5px solid #C9A869;border-radius:20px;overflow:hidden;margin-right:10px;background:#131926}
  .bslide img{width:100%;height:150px;object-fit:cover;display:block}
  .bslide .mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,20,.1),rgba(11,14,20,.9) 85%)}
  .bslide .bt{position:absolute;left:16px;bottom:12px;right:16px}
  .bslide .bt .no{font-size:9.5px;font-weight:800;letter-spacing:2px;color:#C9A869}
  .bslide .bt b{font-size:20px;letter-spacing:3px;color:#F0DFB8;display:block;margin-top:1px}
  .bslide .bt small{display:block;font-size:10px;color:#B8C0D0;margin-top:2px}
  .bslide .stp{position:absolute;top:12px;right:12px;font-size:10px;font-weight:800;border-radius:99px;padding:4px 10px}
  .bslide .stp.done{color:#0c2f1c;background:linear-gradient(135deg,#FFE9A8,#C9A227)}
  .bslide .stp.ing{color:#04182c;background:linear-gradient(135deg,#BFE3FF,#4EA0D8)}
  .bslide .stp.lockd{color:#B8C0D0;background:rgba(20,26,38,.85);border:1px dashed #3A4458}
  .bslide.lockd img{filter:grayscale(.7) brightness(.55)}
  /* 滑动提示点 */
  .bdots{display:flex;justify-content:center;gap:5px;margin-top:8px}
  .bdots i{width:5px;height:5px;border-radius:50%;background:#2A3347;transition:.3s}
  .bdots i.on{background:#C9A869;transform:scale(1.35)}
  .swipe-tip{text-align:center;font-size:9px;color:#4A5568;margin-top:4px;letter-spacing:.2em}
  /* ===== 幕卡片（上一版结构）===== */
  .sec{margin:14px 18px 0;font-size:13px;font-weight:900;color:#EDEBE4;display:flex;justify-content:space-between;align-items:baseline}
  .sec span{font-size:10px;color:#5E6B84;font-weight:700}
  .act{margin:10px 18px 0;background:#131926;border:1.5px solid #232B3D;border-radius:16px;position:relative;overflow:hidden;transition:.3s}
  .act.done{border-color:rgba(201,162,39,.55)}
  .act.ing{border-color:rgba(78,160,216,.55)}
  .act.lockd{opacity:.55}
  .act.open{box-shadow:0 0 18px rgba(201,168,105,.18)}
  .arow{display:flex;gap:12px;padding:12px;cursor:pointer}
  .poster{width:86px;height:116px;flex:none;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.12)}
  .ainfo{flex:1;min-width:0}
  .ainfo .no{font-size:9.5px;font-weight:800;letter-spacing:2px;color:#C9A869}
  .ainfo h3{margin:2px 0 4px;font-size:15.5px;color:#EDEBE4}
  .ainfo p{margin:0;font-size:11px;line-height:1.7;color:#8B96AB}
  .ainfo .epsn{margin-top:6px;font-size:9.5px;color:#5E6B84;font-weight:700}
  .st{position:absolute;top:10px;right:10px;font-size:9px;font-weight:800;border-radius:99px;padding:3px 9px;z-index:2}
  .st.done{color:#0c2f1c;background:linear-gradient(135deg,#FFE9A8,#C9A227)}
  .st.ing{color:#04182c;background:linear-gradient(135deg,#BFE3FF,#4EA0D8)}
  .st.lockd{color:#8B96AB;background:#1A2233;border:1px dashed #3A4458}
  .act .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#C9A227,#FFE9A8)}
  .act .fold{position:absolute;right:12px;bottom:8px;font-size:9px;color:#5E6B84;font-weight:800}
  .act.open .fold{color:#C9A869}
  /* 剧集展开 */
  .eps{display:none;border-top:1px dashed #232B3D;padding:6px 12px 10px}
  .act.open .eps{display:block}
  .ep{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid rgba(35,43,61,.5)}
  .ep:last-child{border-bottom:none}
  .ep .eno{flex:none;width:38px;font-size:10px;font-weight:900;color:#C9A869;font-variant-numeric:tabular-nums}
  .ep .et{flex:1;min-width:0;font-size:11.5px;color:#B8C0D0}
  .ep .et small{display:block;font-size:9px;color:#5E6B84;margin-top:1px}
  .ep .est{flex:none;font-size:9px;font-weight:800;border-radius:99px;padding:3px 8px}
  .ep.watched{cursor:pointer}
  .ep.watched:active{background:rgba(111,211,167,.06)}
  .ep.watched .est{color:#0c2f1c;background:linear-gradient(135deg,#BFF5DC,#6FD3A7)}
  .ep.unw{opacity:.4}
  .ep.unw .est{color:#8B96AB;background:#1A2233;border:1px dashed #3A4458}
  .ep .rb{flex:none;font-size:9px;color:#6FD3A7;font-weight:800}
  .tip{margin:12px 18px 0;font-size:10px;color:#5E6B84;line-height:1.8;text-align:center}
</style>

<script>
/* ===== 六幕框架：一幕含 1~N 集 ===== */
const ACTS=[
 {no:'第一幕',name:'挑战书 · AI危机降临',range:'E01-E04',poster:'assets/hall/think1.png',
  core:'黑信封送到敬天府，张宇老师登场，五个孩子第一次知道自己的大脑里"有一扇门"。',
  tag:'含 4 集 · 世界观 / 导师登场 / 五者特战队组队',
  eps:[['E01','挑战书','AI危机 · 世界观'],['E02','黑信封','信念启蒙 · 图什么'],['E03','开学第一课','导师登场'],['E04','五者特战队','天赋认知 · 组队']]},
 {no:'第二幕',name:'天赋分组仪式',range:'E05-E07',poster:'assets/hall/virtue1.png',
  core:'五把锁现世，天赋测试分班；女生寝室战争爆发，"不能说的秘密"埋下第一条暗线。',
  tag:'含 3 集 · 天赋认知 / 双女主冲突 / 存在的意义',
  eps:[['E05','天赋分组仪式','五把锁 · 天赋测试'],['E06','女生寝室战争','双女主冲突'],['E07','不能说的秘密','存在的意义']]},
 {no:'第三幕',name:'唤醒基本功',range:'E08-E14',poster:'assets/hall/study2.png',
  core:'闹市静坐练专注、石头开花练记忆、书道三部曲开五窍——蒙上眼睛之后，世界反而更清晰。',
  tag:'含 7 集 · 专注力 / 观察力 / 记忆力 / 天赋书道 / 多元感知',
  eps:[['E08','闹市静坐','专注力'],['E09','被欺负的饭桶','观察力'],['E10','石头开花','记忆力'],['E11','眼中有太极','书道Ⅰ'],['E12','心中有太极','篆书开五窍'],['E13','站桩','五兽桩 · 定力'],['E14','蒙上眼睛之后','多元感知']]},
 {no:'第四幕',name:'第一扇门',range:'E15-E22',poster:'assets/hall/win1.png',
  core:'跑道尽头找到入口，738 录音破解，蒙眼闯五角迷宫——家长会那天，一千只眼睛同时睁开。',
  tag:'含 8 集 · 观察推理 / 听觉破解 / 第一关 / 家庭线',
  eps:[['E15','跑道尽头','观察推理 · 入口'],['E16','738','听觉 · 录音破解'],['E17','第一扇门','第一关 · 五角迷宫'],['E18','不需要眼睛','蒙眼感知 · 地图作业'],['E19','家长会','家庭线'],['E20','一千只眼睛','钥匙训练'],['E21','问题汇报（上）','收束'],['E22','问题汇报（下）','收束']]},
 {no:'第五幕',name:'五关连闯',range:'E23-E37',poster:'assets/hall/act1.png',
  core:'书墙十万分之一、记忆碎片拼图、速记阵里的一粒、疾行梯最后交卷的人——九大秘籍逐一点亮。',
  tag:'含 8 集 · 超脑阅读 / 影像追忆 / 扫描速记 / 极速运算 / 极速学习',
  eps:[['E23','10万分之一（上）','第二关 · 书墙'],['E24','10万分之一（下）','超脑阅读×扫描速记'],['E25','记忆碎片拼图','第三关 · 回廊 × 影像追忆'],['E26','10万组合里的一粒（上）','第四关 · 速记阵'],['E27','10万组合里的一粒（下）','扫描速记×极速运算'],['E28','第五关 · 静水深流','专注力考验'],['E29','最后交卷的人（上）','第六关 · 疾行梯'],['E30','最后交卷的人（下）','极速学习']]},
 {no:'第六幕',name:'末日推演 · 机器人危机',range:'未解锁',poster:'assets/miji/sys-ai.jpg',locked:true,
  core:'推演三部曲 × 机器人危机三部曲——当他们走出地下训练场，真正的对手才刚开机。',
  tag:'看完第五幕自动解锁',eps:[]},
];
/* ===== 观看记录（演示：已看到 E25）===== */
const WATCHED_UP_TO=25;
const epNum=s=>parseInt(s.slice(1));
const stOf=a=>a.locked?'lockd':(a.eps.every(e=>epNum(e[0])<=WATCHED_UP_TO)?'done':'ing');
const stTxt={'done':'✓ 已看完','ing':'▶ 在追','lockd':'🔒 未解锁'};
let cur=0;
/* 顶部横滑海报 */
function paintBanner(){
  document.getElementById('banner').innerHTML=ACTS.map((a,i)=>{
    const st=stOf(a);
    return `<div class="bslide ${st}" data-i="${i}">
      <img src="${a.poster}" alt=""><div class="mask"></div>
      <span class="stp ${st}">${stTxt[st]}</span>
      <div class="bt"><span class="no">${a.no} · ${a.range}</span><b>${a.name}</b><small>${a.tag}</small></div>
    </div>`;
  }).join('');
  document.getElementById('bdots').innerHTML=ACTS.map((_,i)=>`<i class="${i===cur?'on':''}"></i>`).join('');
}
/* 幕卡片（上一版结构 + 可展开剧集） */
function paintActs(){
  document.getElementById('acts').innerHTML=ACTS.map((a,i)=>{
    const st=stOf(a);
    const watched=a.eps.filter(e=>epNum(e[0])<=WATCHED_UP_TO).length;
    const pct=a.eps.length?Math.round(watched/a.eps.length*100):0;
    const rows=a.eps.map(e=>{
      const w=epNum(e[0])<=WATCHED_UP_TO;
      return w
        ?`<div class="ep watched" onclick="event.stopPropagation();alert('回看 ${e[0]} · ${e[1]}\\n\\n播放器接入中，敬请期待 🎬')"><span class="eno">${e[0]}</span><span class="et">${e[1]}<small>${e[2]}</small></span><span class="rb">↻ 可回看</span><span class="est">✓ 已看</span></div>`
        :`<div class="ep unw"><span class="eno">${e[0]}</span><span class="et">${e[1]}<small>${e[2]}</small></span><span class="est">未看</span></div>`;
    }).join('');
    return `<div class="act ${st} ${i===cur?'open':''}" id="act${i}">
      <span class="st ${st}">${stTxt[st]}</span>
      <div class="arow" onclick="jump(${i},true)">
        <img class="poster" src="${a.poster}" alt="">
        <div class="ainfo">
          <div class="no">${a.no} · ${a.range}</div>
          <h3>${a.name}</h3>
          <p>${a.core}</p>
          <div class="epsn">${a.locked?'未开始 · 暂不展开':a.tag+' · 已看 '+watched+'/'+a.eps.length+' 集'}</div>
        </div>
      </div>
      <div class="eps">${rows||'<div style="padding:14px 4px;font-size:10.5px;color:#5E6B84;text-align:center">这一幕还没开始，暂不展开</div>'}</div>
      <div class="bar" style="width:${st==='ing'?pct:(st==='done'?100:0)}%${st==='ing'?';background:linear-gradient(90deg,#4EA0D8,#BFE3FF)':''}"></div>
      ${a.locked?'':'<div class="fold">'+(i===cur?'▲ 收起':'▼ 展开剧集')+'</div>'}
    </div>`;
  }).join('');
}
/* 联动：选幕 → 海报滚到对应页 + 卡片展开并滚入视野 */
function jump(i,fromCard){
  const a=ACTS[i];
  if(a.locked){cur=i;paintBanner();paintActs();return;}
  cur=i;paintBanner();paintActs();
  const bn=document.getElementById('banner');
  bn.scrollTo({left:i*(bn.clientWidth),behavior:'smooth'});
  if(fromCard)setTimeout(()=>{const el=document.getElementById('act'+i);el&&el.scrollIntoView({behavior:'smooth',block:'start'});},60);
}
/* 滑动海报 → 自动展开对应一幕 */
let scrT=null;
document.addEventListener('DOMContentLoaded',()=>{
  paintBanner();paintActs();jump(0);
  const bn=document.getElementById('banner');
  bn.addEventListener('scroll',()=>{
    clearTimeout(scrT);
    scrT=setTimeout(()=>{
      const i=Math.round(bn.scrollLeft/bn.clientWidth);
      if(i!==cur&&ACTS[i]){cur=i;paintBanner();paintActs();}
    },120);
  });
});
</script>

<script>
(function(){
  function nav(path){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({type:'dayu-nav', path: path}, '*');
        return;
      }
    }catch(e){}
    location.href = path;
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a');
    if(!a) return;
    var href = a.getAttribute('href') || '';
    if(!href || href.indexOf('javascript:')===0 || href.charAt(0)==='#') return;
    var file = href.split('?')[0].split('#')[0].split('/').pop();
    var map = {'index.html': '/pages/dayu/home', 'train.html': '/pages/training/dayu', 'answer.html': '/pages/qa/dayu', 'drama.html': '/pages/hub/academy', 'milestone.html': '/pages/hub/console', 'test.html': '/pages/talent/hub', 'history.html': '/pages/hub/story', 'courses.html': '/pages/hub/courses', 'parent.html': '/pages/parent/index', 'wallet.html': '/pages/hub/console', 'records.html': '/pages/talent/index?history=1', 'report-v3.html': '/pages/talent/index', 'report-kid.html': '/pages/talent/index', 'plan.html': '/pages/talent/hub?stub=plan', 'relation.html': '/pages/talent/hub?stub=relation', 'birthday.html': '/pages/hub/console'};
    if(map[file] || map[href]){
      e.preventDefault();
      e.stopPropagation();
      nav(map[file] || map[href]);
    }
  }, true);
  // personal test expand -> go real talent
  window.__dayuGoTalent = function(){ nav('/pages/talent/index'); };
})();
</script>
