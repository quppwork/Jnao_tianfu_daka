<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>用量看板 · 本地开发</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0D111F;color:#EDEBE4;padding:20px}
h1{font-size:18px;color:#F5D9A8;margin-bottom:6px}
.sub{font-size:12px;color:#8B93A5;margin-bottom:16px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,button,select{background:#131926;border:1px solid #2A3040;color:#EDEBE4;border-radius:10px;padding:8px 12px;font:inherit}
button{cursor:pointer;background:#2E6BE6;border-color:#2E6BE6;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.card{background:#131926;border:1px solid #2A3040;border-radius:14px;padding:12px}
.card b{display:block;font-size:20px;color:#9AD9FF;margin-top:4px}
.card span{font-size:11px;color:#8B93A5}
table{width:100%;border-collapse:collapse;font-size:12px;background:#131926;border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #1A2132;text-align:left}
th{background:#171E2E;color:#8B93A5;font-size:11px}
td.y{color:#F5D9A8;font-weight:700}
.err{color:#E0863C;margin:8px 0;font-size:13px}
</style>
</head>
<body>
  <h1>用量看板（本地）</h1>
  <p class="sub">读已有接口：/api/usage/wallet · /by-feature · /events。费用来自库表 upstream_usage_event.cost_milli_cent（落账快照），不依赖云网关。</p>
  <div class="row">
    <input id="uid" placeholder="user_id" style="width:120px"/>
    <input id="token" placeholder="Bearer token（可选，若用 cookie/本地登录可空）" style="flex:1;min-width:200px"/>
    <select id="scope"><option value="household">家计</option><option value="me">仅本人</option></select>
    <button type="button" id="go">刷新</button>
  </div>
  <div class="err" id="err"></div>
  <div class="cards" id="cards"></div>
  <h1 style="margin-top:8px;font-size:15px">按功能</h1>
  <div id="feat" style="margin:8px 0 16px"></div>
  <h1 style="font-size:15px">最近调用</h1>
  <div style="overflow:auto;margin-top:8px">
    <table>
      <thead><tr><th>时间</th><th>uid</th><th>功能</th><th>厂商</th><th>tokens</th><th>¥</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
<script>
(function(){
  function qs(id){ return document.getElementById(id); }
  function fmtTok(n){
    n = Number(n)||0;
    if(n>=1e6) return (n/1e6).toFixed(1)+'M';
    if(n>=1000) return (n/1000).toFixed(1)+'k';
    return String(n);
  }
  function fmtY(n){ return '¥'+(Number(n)||0).toFixed(4); }
  async function api(path, uid, token){
    var url = path + (path.indexOf('?')>=0?'&':'?') + 'user_id=' + encodeURIComponent(uid);
    var headers = { 'Accept': 'application/json' };
    if(token) headers.Authorization = 'Bearer ' + token;
    var res = await fetch(url, { headers: headers, credentials: 'include' });
    if(!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0,200));
    return res.json();
  }
  async function load(){
    qs('err').textContent = '';
    var uid = qs('uid').value.trim();
    var token = qs('token').value.trim();
    if(!uid){ qs('err').textContent = '请填 user_id'; return; }
    try{
      var scope = qs('scope').value;
      var wallet = await api('/api/usage/wallet', uid, token);
      var feat = await api('/api/usage/by-feature', uid, token);
      var ev = await api('/api/usage/events?limit=80&scope='+scope, uid, token);
      var acc = wallet.account || {};
      var fam = (wallet.usage && wallet.usage.family_month) || {};
      qs('cards').innerHTML = [
        ['本月点数剩余', (acc.monthly_remaining_points||0)+' / '+(acc.monthly_quota_points||0)],
        ['本月 token', fmtTok(fam.total_tokens)],
        ['本月成本', fmtY(fam.cost_yuan)],
        ['充值余额', '¥'+((acc.balance_yuan||0).toFixed(2))]
      ].map(function(x){ return '<div class="card"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'; }).join('');
      var list = (scope==='me' ? feat.me : (feat.household||feat.me)) || [];
      qs('feat').innerHTML = '<table><thead><tr><th>功能</th><th>tokens</th><th>次数</th><th>¥</th></tr></thead><tbody>' +
        list.map(function(s){
          return '<tr><td>'+(s.label||s.feature)+'</td><td>'+fmtTok(s.total_tokens)+'</td><td>'+(s.call_count||0)+'</td><td class="y">'+fmtY(s.cost_yuan)+'</td></tr>';
        }).join('') + '</tbody></table>';
      qs('tb').innerHTML = (ev.items||[]).map(function(r){
        return '<tr><td>'+(r.created_at||'')+'</td><td>'+r.user_id+'</td><td>'+(r.feature||'-')+'</td><td>'+(r.provider||'')+'</td><td>'+fmtTok(r.total_tokens)+'</td><td class="y">'+fmtY(r.cost_yuan)+'</td></tr>';
      }).join('') || '<tr><td colspan="6">暂无明细</td></tr>';
    }catch(e){
      qs('err').textContent = String(e.message||e);
    }
  }
  qs('go').onclick = load;
  try{
    var u = localStorage.getItem('child_user_id') || localStorage.getItem('user_id') || '';
    if(u) qs('uid').value = u;
  }catch(_){}
})();
</script>
</body></html>
