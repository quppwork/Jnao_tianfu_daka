<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>劲脑天赋学院 · 内部频道</title>
<link rel="stylesheet" href="/static/dayu/style.css"/>
<style>
  body{background:#0B0E14}
  /* ===== 学院头部 ===== */
  .academy{margin:12px 18px 0;background:linear-gradient(160deg,#1A2233,#0E1420 75%);border:1.5px solid #C9A869;border-radius:20px;padding:16px;position:relative;overflow:visible;z-index:6}
  .academy::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,105,.18),transparent 70%)}
  .ac-row{display:flex;align-items:center;gap:12px;position:relative}
  .ac-badge{width:52px;height:52px;flex:none;border-radius:50%;background:conic-gradient(from 200deg,#C9A869,#8A6BF0,#3E8E5A,#C9A869);padding:2.5px}
  .ac-badge i{display:flex;width:100%;height:100%;border-radius:50%;background:#0B0E14;align-items:center;justify-content:center;font-style:normal;font-size:24px}
  .ac-name{font-size:21px;font-weight:900;color:#F0DFB8;letter-spacing:2px}
  .ac-name small{display:block;font-size:10px;letter-spacing:3px;color:#8B93A5;font-weight:700;margin-top:2px}
  .ac-lv{margin-left:auto;font-size:11px;font-weight:800;color:#6FCF8E;border:1px solid rgba(111,207,142,.5);border-radius:99px;padding:4px 11px;flex:none}
  .ac-chan{display:flex;align-items:center;gap:6px;margin-top:10px;background:rgba(11,14,20,.6);border:1px solid #232B3D;border-radius:12px;padding:10px 12px;position:relative;z-index:7;-webkit-tap-highlight-color:transparent}
  .ac-chan .hash{font-size:16px;font-weight:900;color:#6FCF8E}
  .ac-chan b{font-size:13px;font-weight:900;color:#EDEBE4;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none!important;box-shadow:none!important;-webkit-tap-highlight-color:transparent;border-radius:4px}
  .ac-chan b:focus,.ac-chan b:focus-visible,.ac-chan b:active{outline:none!important;box-shadow:none!important;background:transparent}
  .ac-chan b::after{content:" ▾";font-size:10px;color:#6FCF8E;font-weight:800}
  .ac-chan .online{margin-left:auto;font-size:10.5px;color:#6FCF8E;font-weight:800}
  .ac-chan .online::before{content:"● ";animation:blink 1.6s infinite}
  .ep-pick{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 6px);z-index:80;min-width:220px;background:#121722;border:1px solid #2A3347;border-radius:12px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
  .ep-pick.open{display:block}
  .ep-pick button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#EDEBE4;font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:8px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
  .ep-pick button:focus,.ep-pick button:focus-visible{outline:none;background:#1A2233}
  .ep-pick button.on{background:#1A2233;color:#6FCF8E}
  .ep-pick button:disabled{opacity:.45;cursor:not-allowed}
  @keyframes blink{50%{opacity:.25}}
  .ac-notice{margin-top:9px;font-size:11.5px;color:#9C8DC4;display:flex;gap:7px;align-items:center;position:relative}
  .ac-notice .ni{flex:none}
  /* ===== 视频区 ===== */
  .vbox{margin:12px 18px 0;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;background:#000;border:1.5px solid #232B3D}
  .vbox>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vbox .vshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,.15),rgba(5,8,14,.72))}
  .vbox .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#C9A869;color:#101623;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 8px rgba(255,255,255,.16),0 10px 24px rgba(0,0,0,.5);animation:vpulse 2s infinite;z-index:3}
  @keyframes vpulse{0%,100%{box-shadow:0 0 0 8px rgba(255,255,255,.16)}50%{box-shadow:0 0 0 16px rgba(255,255,255,.07)}}
  .vbox .vtitle{position:absolute;left:14px;bottom:12px;z-index:2}
  .vbox .vtitle b{display:block;font-size:16px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .vbox .vtitle span{font-size:11px;color:rgba(255,255,255,.85)}
  .vbox .vdur{position:absolute;right:12px;top:10px;z-index:2;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:3px 9px}
  .vbox .vlive{position:absolute;left:12px;top:10px;z-index:2;font-size:10px;font-weight:900;color:#FFD76F;background:rgba(0,0,0,.5);border-radius:6px;padding:3px 9px}
  .vprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18);z-index:4;display:none}
  .vprog i{display:block;height:100%;width:0;background:#C9A869}
  .playing .vprog{display:block}
  .playing .vplay,.playing .vtitle,.playing .vlive,.playing .vdur{display:none}
  .playing > img,.playing .vshade{opacity:0;pointer-events:none}
  .playing #vvideo{z-index:4;display:block!important}
  /* 播完：藏自定义播放键，避免与原生 controls 大圆叠两层 */
  .vbox.ended .vplay,.vbox.ended .vtitle,.vbox.ended .vlive,.vbox.ended .vdur{display:none!important}
  .vbox.ended #vvideo{pointer-events:none}
  /* 弹幕层 */
  .dmk{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;display:none}
  .playing .dmk{display:block}
  .dm{position:absolute;white-space:nowrap;font-size:12px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.8);animation:dmf linear forwards}
  .dm b{font-weight:900}
  @keyframes dmf{from{transform:translateX(430px)}to{transform:translateX(-110%)}}
  .vend{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,14,.72);backdrop-filter:blur(3px)}
  .vend .ve1{font-size:17px;font-weight:900;color:#F0DFB8}
  .vend .ve2{font-size:12px;color:#B9C0CE;margin-top:6px}
  .vend .ve3{margin-top:14px;background:#6FCF8E;color:#0B0E14;font-size:14px;font-weight:900;border-radius:99px;padding:10px 22px;cursor:pointer}
  /* ===== 场景舞台 ===== */
  .stage{margin:12px 18px 0;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/7.5;background:#0E1420;border:1.5px solid #232B3D;display:none}
  .stage.on{display:block}
  .stage .scimg{position:absolute;inset:0;width:100%;height:106%;object-fit:cover;animation:kenburns 9s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1) translateY(0)}to{transform:scale(1.09) translateY(-2.5%)}}
  .stage .scchar{position:absolute;right:4%;bottom:-6%;height:92%;width:auto;max-width:52%;object-fit:contain;z-index:2;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));animation:charbob 3.2s ease-in-out infinite;pointer-events:none}
  @keyframes charbob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-7px) rotate(.8deg)}}
  .stage .scchar.vc{height:auto;width:38%;max-width:42%;right:6%;bottom:auto;top:12%;border-radius:16px;border:2px solid rgba(201,168,105,.7);box-shadow:0 10px 26px rgba(0,0,0,.6);object-fit:cover;filter:none}
  .stage .prop{position:absolute;z-index:3;font-size:24px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .stage .prop.phone{right:24%;bottom:26%;animation:phonetilt 2.4s ease-in-out infinite}
  @keyframes phonetilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(5deg)}}
  .stage .prop.chips{right:26%;bottom:44%;animation:chipbob 1.6s ease-in-out infinite}
  @keyframes chipbob{0%,100%{transform:translateY(16px) rotate(-8deg)}50%{transform:translateY(-4px) rotate(8deg)}}
  .stage .scshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,.05) 55%,rgba(5,8,14,.82))}
  .stage .sclive{position:absolute;right:12px;top:10px;z-index:4;font-size:9.5px;font-weight:900;color:#FF7A7A;background:rgba(0,0,0,.5);border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:5px}
  .stage .sclive::before{content:"";width:6px;height:6px;border-radius:50%;background:#FF5252;animation:blink 1.2s infinite}
  .stage .scwho{position:absolute;left:13px;bottom:11px;z-index:4;display:flex;align-items:center;gap:8px}
  .stage .scwho .sa{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #C9A869}
  .stage .scwho b{font-size:14px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
  .stage .scwho span{font-size:10px;color:#C9A869;font-weight:800}
  /* ===== 聊天频道（默认卡片） ===== */
  .chatroom{margin:12px 18px calc(var(--chat-dock-h, 120px) + 8px);background:#121826;border:1.5px solid #232B3D;border-radius:18px;padding:12px 12px 8px;position:relative;display:flex;flex-direction:column;min-height:min(36vh,280px);box-sizing:border-box}
  .cr-head{display:flex;align-items:center;gap:8px;padding:16px 0 9px;border-bottom:1px solid #1A2233;margin-bottom:10px;flex:none;position:relative;touch-action:pan-y}
  .cr-head b{font-size:13.5px;font-weight:900;color:#EDEBE4;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cr-head .on9{margin-left:0;font-size:10px;color:#6FCF8E;font-weight:800;flex:none}
  .cr-head .on9::before{content:"●";margin-right:4px}
  /* 手机手势提示条（非按钮）：图一下滑进讨论 / 讨论上滑回学院 */
  .cr-grab{display:none;position:absolute;left:50%;top:6px;transform:translateX(-50%);width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.28);pointer-events:none}
  #msgwrap{flex:1 1 auto;min-height:160px;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding-bottom:12px;box-sizing:border-box}
  /* 进讨论组：单独占满一页（顶到输入栏），像 QQ 聊天页 */
  .phone.qq-chat .chatroom{
    position:fixed;left:50%;transform:translateX(-50%);
    width:100%;max-width:var(--app-max-width,480px);
    top:var(--qq-top,0px);
    bottom:calc(var(--chat-dock-h,110px) + 56px + env(safe-area-inset-bottom,0px));
    margin:0;z-index:18;border-radius:0;border-bottom:none;border-left:none;border-right:none;
    min-height:0;height:auto;
    transition:top .28s cubic-bezier(.22,.61,.36,1),border-radius .28s ease;
  }
  .phone.qq-chat #msgwrap{flex:1 1 auto;min-height:0;height:auto;max-height:none}
  .phone.qq-chat .cr-grab{display:block}
  .phone.qq-chat .chatroom-spacer{display:block;height:calc(100dvh - var(--qq-top,0px) - var(--chat-dock-h,110px) - 56px);pointer-events:none}
  .chatroom-spacer{display:none}
  /* 全页讨论：收起上方学院/正片/实况 */
  .phone.qq-chat:not(.qq-peek) .academy,
  .phone.qq-chat:not(.qq-peek) .vbox,
  .phone.qq-chat:not(.qq-peek) .stage{display:none!important}
  .phone.qq-chat:not(.qq-peek){--qq-top:0px}
  /* 学院页（peek）：对话窗贴在下方，可下滑回全屏讨论 */
  .phone.qq-chat.qq-peek .chatroom{border-radius:14px 14px 0 0;border:1.5px solid #232B3D;border-bottom:none;min-height:52px}
  .phone.qq-chat.qq-peek .cr-grab{width:42px;background:rgba(255,255,255,.38)}
  .phone.qq-chat .cr-head{cursor:grab;-webkit-user-select:none;user-select:none}
  .phone.qq-chat .cr-head:active{cursor:grabbing}
  .phone.qq-chat.qq-dragging .chatroom{transition:none!important}
  .msg{display:flex;gap:8px;margin-bottom:14px;animation:stin .3s ease}
  @keyframes stin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .msg .ma{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;border:1px solid rgba(255,255,255,.08)}
  .msg .mc{max-width:78%}
  .msg .mn{font-size:12px;color:#8B93A5;font-weight:600;margin-bottom:4px;letter-spacing:.02em}
  .msg .mn i{font-style:normal;color:#7BC99A;border:1px solid rgba(123,201,154,.35);border-radius:4px;padding:0 5px;margin-left:5px;font-size:10px;font-weight:600}
  .msg .mb{background:#252C3C;border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:16px;color:#EEF1F6;line-height:1.55;font-weight:400;letter-spacing:.01em}
  .msg.me{flex-direction:row-reverse}
  .msg.me .mb{background:#4A7AE0;color:#fff;border-radius:16px 4px 16px 16px}
  .msg.me .mn{text-align:right}
  .msg.sys{justify-content:center}
  .msg.sys .mb{background:transparent;color:#6B7385;font-size:12px;padding:2px 10px;border:1px dashed #2A3040;border-radius:99px}
  .typing{display:flex;gap:8px;margin:4px 0 2px;align-items:center;flex:none}
  .typing .tdots{background:#252C3C;border-radius:4px 16px 16px 16px;padding:12px 14px;display:flex;gap:4px}
  .typing .tdots i{width:6px;height:6px;border-radius:50%;background:#8B93A5;animation:tp 1.2s infinite}
  .typing .tdots i:nth-child(2){animation-delay:.2s}
  .typing .tdots i:nth-child(3){animation-delay:.4s}
  @keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  /* 模糊预告层 */
  .locked-teaser #msgwrap{filter:blur(5px) saturate(.8);pointer-events:none;user-select:none}
  .lockov{position:absolute;inset:44px 0 0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .locked-teaser .lockov{display:flex}
  .lockov .lk1{font-size:15px;font-weight:900;color:#EDEBE4;text-shadow:0 2px 8px #000}
  .lockov .lk2{font-size:11.5px;color:#B9C0CE}
  .lockov .lk3{margin-top:6px;font-size:11px;font-weight:900;color:#0B0E14;background:#C9A869;border-radius:99px;padding:7px 16px}
  /* 底坞：不透明，避免讨论组与输入之间透出一大块黑 */
  .chat-dock{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;width:100%;max-width:var(--app-max-width,480px);z-index:20;box-sizing:border-box;padding:8px 12px 10px;background:rgba(11,14,20,.98);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(35,43,61,.85)}
  .chat-dock #nudgeSlot:empty{display:none}
  .nudge{display:flex;gap:8px;align-items:center;margin:0 0 8px;background:rgba(111,207,142,.1);border:1px dashed rgba(111,207,142,.5);border-radius:13px;padding:10px 10px 10px 12px;animation:stin .4s;position:relative}
  .nudge .ng1{font-size:22px;flex:none}
  .nudge p{flex:1;font-size:13px;color:#B9E5CB;line-height:1.55;padding-right:2px}
  .nudge a,.nudge .ngo{flex:none;font-size:12px;font-weight:700;color:#0B0E14;background:#6FCF8E;border-radius:9px;padding:7px 11px;text-decoration:none;border:none;cursor:pointer;font-family:inherit}
  .nudge .ngx{flex:none;width:22px;height:22px;margin:-2px -2px 0 0;align-self:flex-start;border:none;border-radius:50%;background:transparent;color:#7BA88C;font-size:16px;line-height:1;font-weight:700;cursor:pointer;padding:0;font-family:inherit;opacity:.85}
  .nudge .ngx:hover,.nudge .ngx:active{color:#B9E5CB;opacity:1}
  .replies{display:flex;flex-wrap:nowrap;gap:8px;margin:0 0 8px;padding:0 2px 2px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;touch-action:pan-x}
  .replies[hidden],.replies[style*="display: none"],.replies[style*="display:none"]{margin:0!important;padding:0!important}
  .replies::-webkit-scrollbar{display:none;height:0}
  .replies::after{content:"";flex:0 0 12px}
  .rp{flex:0 0 auto;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#1A2230;border:1px solid #2E3648;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.35;color:#D5DBE8;cursor:pointer}
  .rp:active{transform:scale(.97);opacity:.88}
  .rp:hover{border-color:rgba(201,168,105,.55);color:#EDEBE4}
  .chat-dock .inbar{position:static;transform:none;width:100%;max-width:none;padding:0;background:transparent;display:flex;gap:10px;align-items:center}
  .inbar input{flex:1;background:#161D2B;border:1px solid #2A3040;border-radius:999px;padding:12px 16px;font-size:16px;color:#EEF1F6;outline:none;font-weight:400}
  .inbar input:focus{border-color:#C9A869}
  .inbar .send{width:42px;height:42px;border-radius:50%;background:#C9A869;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;color:#101623;font-weight:900;cursor:pointer;border:none}
  .phone{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
  .cr-head b{font-size:15px;font-weight:700}
</style>

.card{background:#d9dfec;border:1.5px solid #c2cadc;border-radius:16px;padding:14px 16px}html.lt .sec-t{font-size:18px;font-weight:900;color:#1b1912;margin:0 18px 10px;display:flex;align-items:center;gap:8px}html.lt .sub{font-size:12.5px;color:#5a6274;line-height:1.5}html.lt /* 大宇气泡 */
.dayu{display:flex;gap:8px;align-items:flex-end;margin:12px 18px}html.lt .dayu .bear{width:52px;height:52px;border-radius:50%;background:url("/static/dayu/assets/avatar_sizhe.jpg") center/cover;border:2px solid #30904f;box-shadow:0 0 14px rgba(48,144,79,.45);flex:none}html.lt .bubble{background:#d4dbe9;border:1px solid #bfc5d5;border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:14px;color:#191d27;line-height:1.55}html.lt .bubble b{color:#30904f}html.lt /* 大按钮 */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;background:#30904f;color:#ebeef4;border-radius:14px;padding:14px;font-size:17px;font-weight:900;margin:12px 18px}html.lt .cta.blue{background:#1956d1;color:#141414}html.lt .cta.gold{background:linear-gradient(90deg,#967536,#70561c);color:#f7f1e5}html.lt /* 底栏 */

  const slot=$('nudgeSlot');

    try{
      const epId=(window.JnaoAcademy&&window.JnaoAcademy.state&&window.JnaoAcademy.state.episode&&window.JnaoAcademy.state.episode.id)||'';
      if(epId) sessionStorage.setItem('jnao_nudge_dismiss_'+epId,'1');
    }catch(e){}
  }
  syncChatDock();
}
function dismissNudge(){ clearNudgeUi(true); }
window.clearNudgeUi=clearNudgeUi;
window.dismissNudge=dismissNudge;
function addNudge(){
  if(nudgeShown)return;
  try{
    const epId=(window.JnaoAcademy&&window.JnaoAcademy.state&&window.JnaoAcademy.state.episode&&window.JnaoAcademy.state.episode.id)||'';
    if(epId && sessionStorage.getItem('jnao_nudge_dismiss_'+epId)==='1') return;
    const ep=window.JnaoAcademy&&window.JnaoAcademy.state&&window.JnaoAcademy.state.episode;
    if(ep && ep.training_done) return;
  }catch(e){}
  nudgeShown=true;

  d.appendChild(close);

  if(slot) slot.appendChild(d);
  syncChatDock();
  scrollChat();
}
function syncChatDock(){
  const dock=$('chatDock');
  const room=$('chatroom');
  const phone=document.querySelector('.phone');
  const wrap=$('msgwrap');
  if(!dock) return;
  const h=Math.ceil(dock.getBoundingClientRect().height||110);
  document.documentElement.style.setProperty('--chat-dock-h', h+'px');
  if(!room || !phone) return;
  const joined=!room.classList.contains('locked-teaser');
  phone.classList.toggle('qq-chat', joined);
  if(wrap){
    wrap.style.height='';
    wrap.style.minHeight='';
    wrap.style.maxHeight='';
  }
  if(!joined){
    phone.classList.remove('qq-peek');
    document.documentElement.style.removeProperty('--qq-top');
    return;
  }
  const peek=phone.classList.contains('qq-peek');
  if(!peek){
    // 讨论组全页
    document.documentElement.style.setProperty('--qq-top', '0px');
    return;
  }
  // 学院页：对话顶边贴住上方可见块底（并保证标题条可拖）
  var top = 8;
  [document.querySelector('.academy'), $('vbox'), $('stage')].forEach(function(el){
    if(!el) return;
    if(el.id==='stage' && !el.classList.contains('on')) return;
    var r=el.getBoundingClientRect();
    if(r.height < 8) return;
    if(r.bottom > top) top = r.bottom;
  });
  var dockH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chat-dock-h')) || 110;
  var maxTop = Math.max(48, window.innerHeight - dockH - 56 - 56);
  document.documentElement.style.setProperty('--qq-top', Math.min(Math.round(top + 8), maxTop)+'px');
}
/** @param {boolean=} force true=学院页(peek) false=全屏讨论 */
function toggleChatPeek(force){
  const phone=document.querySelector('.phone');
  const room=$('chatroom');
  if(!phone || !room || room.classList.contains('locked-teaser')) return;
  const next = typeof force==='boolean' ? force : !phone.classList.contains('qq-peek');
  phone.classList.toggle('qq-peek', next);
  phone.classList.remove('qq-dragging');
  syncChatDock();
  if(next){
