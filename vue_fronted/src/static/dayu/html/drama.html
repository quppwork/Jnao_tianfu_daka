<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>劲脑天赋学院 · 内部频道</title>
<link rel="stylesheet" href="/static/dayu/style.css"/>
<style>
  body{background:#0B0E14}
  /* ===== 学院头部 ===== */
  .academy{margin:12px 18px 0;background:linear-gradient(160deg,#1A2233,#0E1420 75%);border:1.5px solid #C9A869;border-radius:20px;padding:16px;position:relative;overflow:hidden}
  .academy::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,105,.18),transparent 70%)}
  .ac-row{display:flex;align-items:center;gap:12px;position:relative}
  .ac-badge{width:52px;height:52px;flex:none;border-radius:50%;background:conic-gradient(from 200deg,#C9A869,#8A6BF0,#3E8E5A,#C9A869);padding:2.5px}
  .ac-badge i{display:flex;width:100%;height:100%;border-radius:50%;background:#0B0E14;align-items:center;justify-content:center;font-style:normal;font-size:24px}
  .ac-name{font-size:21px;font-weight:900;color:#F0DFB8;letter-spacing:2px}
  .ac-name small{display:block;font-size:10px;letter-spacing:3px;color:#8B93A5;font-weight:700;margin-top:2px}
  .ac-lv{margin-left:auto;font-size:11px;font-weight:800;color:#6FCF8E;border:1px solid rgba(111,207,142,.5);border-radius:99px;padding:4px 11px;flex:none}
  .ac-chan{display:flex;align-items:center;gap:8px;margin-top:13px;background:rgba(11,14,20,.6);border:1px solid #232B3D;border-radius:12px;padding:10px 12px;position:relative}
  .ac-chan .hash{font-size:16px;font-weight:900;color:#C9A869}
  .ac-chan b{font-size:14px;font-weight:900;color:#EDEBE4}
  .ac-chan .online{margin-left:auto;font-size:10.5px;color:#6FCF8E;font-weight:800}
  .ac-chan .online::before{content:"● ";animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .ac-notice{margin-top:9px;font-size:11.5px;color:#9C8DC4;display:flex;gap:7px;align-items:center;position:relative}
  .ac-notice .ni{flex:none}
  /* ===== 视频区 ===== */
  .vbox{margin:12px 18px 0;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/9;background:#000;border:1.5px solid #232B3D}
  .vbox>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .vbox .vshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,.15),rgba(5,8,14,.72))}
  .vbox .vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#C9A869;color:#101623;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 8px rgba(255,255,255,.16),0 10px 24px rgba(0,0,0,.5);animation:vpulse 2s infinite;z-index:3}
  @keyframes vpulse{0%,100%{box-shadow:0 0 0 8px rgba(255,255,255,.16)}50%{box-shadow:0 0 0 16px rgba(255,255,255,.07)}}
  .vbox .vtitle{position:absolute;left:14px;bottom:12px;z-index:2}
  .vbox .vtitle b{display:block;font-size:16px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .vbox .vtitle span{font-size:11px;color:rgba(255,255,255,.85)}
  .vbox .vdur{position:absolute;right:12px;top:10px;z-index:2;font-size:10.5px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:3px 9px}
  .vbox .vlive{position:absolute;left:12px;top:10px;z-index:2;font-size:10px;font-weight:900;color:#FFD76F;background:rgba(0,0,0,.5);border-radius:6px;padding:3px 9px}
  .vprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18);z-index:4;display:none}
  .vprog i{display:block;height:100%;width:0;background:#C9A869}
  .playing .vprog{display:block}
  .playing .vplay,.playing .vtitle{display:none}
  /* 弹幕层 */
  .dmk{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;display:none}
  .playing .dmk{display:block}
  .dm{position:absolute;white-space:nowrap;font-size:12px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.8);animation:dmf linear forwards}
  .dm b{font-weight:900}
  @keyframes dmf{from{transform:translateX(430px)}to{transform:translateX(-110%)}}
  .vend{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,14,.72);backdrop-filter:blur(3px)}
  .vend .ve1{font-size:17px;font-weight:900;color:#F0DFB8}
  .vend .ve2{font-size:12px;color:#B9C0CE;margin-top:6px}
  .vend .ve3{margin-top:14px;background:#6FCF8E;color:#0B0E14;font-size:14px;font-weight:900;border-radius:99px;padding:10px 22px;cursor:pointer}
  /* ===== 场景舞台 ===== */
  .stage{margin:12px 18px 0;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/7.5;background:#0E1420;border:1.5px solid #232B3D;display:none}
  .stage.on{display:block}
  .stage .scimg{position:absolute;inset:0;width:100%;height:106%;object-fit:cover;animation:kenburns 9s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1) translateY(0)}to{transform:scale(1.09) translateY(-2.5%)}}
  .stage .scchar{position:absolute;right:8%;bottom:-4%;height:88%;z-index:2;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));animation:charbob 3.2s ease-in-out infinite}
  @keyframes charbob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-7px) rotate(.8deg)}}
  .stage .scchar.vc{height:auto;width:38%;right:6%;bottom:auto;top:12%;border-radius:16px;border:2px solid rgba(201,168,105,.7);box-shadow:0 10px 26px rgba(0,0,0,.6)}
  .stage .prop{position:absolute;z-index:3;font-size:24px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
  .stage .prop.phone{right:24%;bottom:26%;animation:phonetilt 2.4s ease-in-out infinite}
  @keyframes phonetilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(5deg)}}
  .stage .prop.chips{right:26%;bottom:44%;animation:chipbob 1.6s ease-in-out infinite}
  @keyframes chipbob{0%,100%{transform:translateY(16px) rotate(-8deg)}50%{transform:translateY(-4px) rotate(8deg)}}
  .stage .scshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,14,.05) 55%,rgba(5,8,14,.82))}
  .stage .sclive{position:absolute;right:12px;top:10px;z-index:4;font-size:9.5px;font-weight:900;color:#FF7A7A;background:rgba(0,0,0,.5);border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:5px}
  .stage .sclive::before{content:"";width:6px;height:6px;border-radius:50%;background:#FF5252;animation:blink 1.2s infinite}
  .stage .scwho{position:absolute;left:13px;bottom:11px;z-index:4;display:flex;align-items:center;gap:8px}
  .stage .scwho .sa{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #C9A869}
  .stage .scwho b{font-size:14px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
  .stage .scwho span{font-size:10px;color:#C9A869;font-weight:800}
  /* ===== 聊天频道 ===== */
  .chatroom{margin:12px 18px 0;background:#0E1420;border:1.5px solid #232B3D;border-radius:18px;padding:12px 12px 8px;position:relative}
  .cr-head{display:flex;align-items:center;gap:8px;padding-bottom:9px;border-bottom:1px solid #1A2233;margin-bottom:10px}
  .cr-head b{font-size:13.5px;font-weight:900;color:#EDEBE4}
  .cr-head .on9{margin-left:auto;font-size:10px;color:#6FCF8E;font-weight:800}
  .cr-head .on9::before{content:"●";margin-right:4px}
  #msgwrap{max-height:430px;overflow-y:auto;position:relative}
  .msg{display:flex;gap:8px;margin-bottom:12px;animation:stin .3s ease}
  @keyframes stin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .msg .ma{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid #2A3040}
  .msg .mc{max-width:78%}
  .msg .mn{font-size:10.5px;color:#5A6274;font-weight:800;margin-bottom:3px}
  .msg .mn i{font-style:normal;color:#3E8E5A;border:1px solid rgba(62,142,90,.5);border-radius:5px;padding:0 4px;margin-left:4px;font-size:9px}
  .msg .mb{background:#1A2233;border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14px;color:#E4E8F0;line-height:1.6}
  .msg.me{flex-direction:row-reverse}
  .msg.me .mb{background:linear-gradient(135deg,#3A7BFF,#2E5BD6);color:#fff;border-radius:14px 4px 14px 14px}
  .msg.me .mn{text-align:right}
  .msg.sys{justify-content:center}
  .msg.sys .mb{background:transparent;color:#5A6274;font-size:11px;padding:2px 10px;border:1px dashed #2A3040;border-radius:99px}
  .typing{display:flex;gap:8px;margin-bottom:12px;align-items:center}
  .typing .tdots{background:#1A2233;border-radius:4px 14px 14px 14px;padding:11px 14px;display:flex;gap:4px}
  .typing .tdots i{width:6px;height:6px;border-radius:50%;background:#8B93A5;animation:tp 1.2s infinite}
  .typing .tdots i:nth-child(2){animation-delay:.2s}
  .typing .tdots i:nth-child(3){animation-delay:.4s}
  @keyframes tp{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  /* 模糊预告层 */
  .locked-teaser #msgwrap{filter:blur(5px) saturate(.8);pointer-events:none;user-select:none}
  .lockov{position:absolute;inset:44px 0 0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .locked-teaser .lockov{display:flex}
  .lockov .lk1{font-size:15px;font-weight:900;color:#EDEBE4;text-shadow:0 2px 8px #000}
  .lockov .lk2{font-size:11.5px;color:#B9C0CE}
  .lockov .lk3{margin-top:6px;font-size:11px;font-weight:900;color:#0B0E14;background:#C9A869;border-radius:99px;padding:7px 16px}
  /* 轻提醒卡（训练归训练，互动归互动） */
  .nudge{display:flex;gap:10px;align-items:center;margin:4px 0 12px;background:rgba(111,207,142,.07);border:1px dashed rgba(111,207,142,.5);border-radius:13px;padding:10px 12px;animation:stin .4s}
  .nudge .ng1{font-size:22px;flex:none}
  .nudge p{flex:1;font-size:12px;color:#B9E5CB;line-height:1.55}
  .nudge a{flex:none;font-size:11.5px;font-weight:900;color:#0B0E14;background:#6FCF8E;border-radius:9px;padding:7px 11px;text-decoration:none}
  /* 快捷话题 */
  .replies{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
  .rp{background:#131926;border:1.5px solid #2A3040;border-radius:99px;padding:8px 13px;font-size:12px;font-weight:700;color:#D8DCE6;cursor:pointer}
  .rp:active{transform:scale(.95)}
  .rp:hover{border-color:#C9A869}
  /* 输入条 */
  .inbar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-max-width, 480px);padding:8px 18px;display:flex;gap:10px;align-items:center;background:rgba(11,14,20,.94);z-index:20}
  .inbar input{flex:1;background:#161D2B;border:1.5px solid #2A3040;border-radius:999px;padding:11px 16px;font-size:13.5px;color:#EDEBE4;outline:none}
  .inbar input:focus{border-color:#C9A869}
  .inbar .send{width:42px;height:42px;border-radius:50%;background:#C9A869;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;color:#101623;font-weight:900;cursor:pointer;border:none}
</style>

};

const TEASER=[

 ['chenxue','就这？我能站半小时😏'],

<script src="birthday.js"></script>
<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let joined=false,msgCount=0,nudgeShown=false,lastResponder='';

/* ---------- 场景舞台 ---------- */
function showScene(key){
  const c=CHARS[key];
  $('scimg').src=c.bg;
  const sp=$('scchar'); sp.src=c.sp; sp.classList.toggle('vc',!!c.vc);
  $('scava').src=c.av; $('scname').textContent=c.n; $('scdesc').textContent=c.sd;
  $('propPhone').style.display=c.phone?'block':'none';
  $('propChips').style.display=c.chips?'block':'none';
}
/* ---------- 消息渲染 ---------- */
function addMsg(who,text){
  const c=CHARS[who];
  const d=document.createElement('div');
  d.className='msg';
  d.innerHTML=`<img class="ma" src="${c.av}"><div class="mc"><div class="mn">${c.n}<i>${c.tag}</i></div><div class="mb">${text}</div></div>`;
  $('msgs').appendChild(d); scrollChat();
}
function addMe(text){
  const d=document.createElement('div');
  d.className='msg me';
  d.innerHTML=`<div class="mc"><div class="mn">我</div><div class="mb">${text}</div></div>`;
  $('msgs').appendChild(d); scrollChat();
}
function addSys(t){
  const d=document.createElement('div');
  d.className='msg sys'; d.innerHTML=`<div class="mb">${t}</div>`;
  $('msgs').appendChild(d); scrollChat();
}
function addNudge(){
  if(nudgeShown)return; nudgeShown=true;
  const d=document.createElement('div');
  d.className='nudge';
  d.innerHTML=`<div class="ng1">⏰</div><p>善雨导师提醒：聊完记得完成今晚训练——${EP.task}，到大宇智能体打卡。</p><a href="train.html">去打卡</a>`;
  $('msgs').appendChild(d); scrollChat();
}
function scrollChat(){const w=$('msgwrap');w.scrollTop=w.scrollHeight;}
function showTyping(key,cb,wait){
  const c=CHARS[key]; showScene(key);
  $('tyava').src=c.av; $('typing').style.display='flex';
  setTimeout(()=>{$('typing').style.display='none';cb();},wait||900+Math.random()*700);
}
/* ---------- 播放前：模糊滚动预告 ---------- */
let teaserTm=null;
function startTeaser(){
  let i=0;
  const push=()=>{
    if(joined)return;
    const [w,t]=TEASER[i%TEASER.length]; i++;
    addMsg(w,t);
    const list=$('msgs').children;
    if(list.length>7)list[0].remove();
    teaserTm=setTimeout(push,1700+Math.random()*1200);
  };
  push();
}
/* ---------- 播放中：弹幕 ---------- */
let dmTm=null;
function startDanmaku(){
  let i=0;
  const fire=()=>{
    if(!$('vbox').classList.contains('playing'))return;
    const [w,c,t]=DANMAKU[i%DANMAKU.length]; i++;
    const d=document.createElement('div');
    d.className='dm'; d.style.top=(8+Math.random()*55)+'%';
    d.innerHTML=`<b style="color:${c}">${t}</b>`;
    d.style.animationDuration=(6+Math.random()*3)+'s';
    $('dmk').appendChild(d);
    setTimeout(()=>d.remove(),9500);
    dmTm=setTimeout(fire,1300+Math.random()*900);
  };
  fire();
}
/* ---------- 播放控制 ---------- */
let playing=false;
function playEp(){
  if(playing)return; playing=true;
  $('vbox').classList.add('playing');
  startDanmaku();
  let p=0;
  const tm=setInterval(()=>{
    p+=1.2; $('vprogI').style.width=Math.min(100,p)+'%';
    if(p>=100){
      clearInterval(tm); playing=false;
      $('vbox').classList.remove('playing');
      $('dmk').innerHTML='';
      $('vend').style.display='flex';
    }
  },90); // 演示：约7.5秒模拟正片播完（接真实视频后替换为 ended 事件）
}
/* ---------- 加入频道 ---------- */
function joinChat(){
  joined=true; clearTimeout(teaserTm);
  $('vend').style.display='none';
  $('msgs').innerHTML='';
  $('chatroom').classList.remove('locked-teaser');
  $('stage').classList.add('on');
  $('inp').disabled=false;
  $('inp').placeholder='说点什么，角色们都在…';
  $('chatroom').scrollIntoView({behavior:'smooth'});
  addSys('你加入了 #E13 · 五兽桩讨论组');
  // 角色围绕本集自然开场（随机3条+导师收尾）
  const openers=['yuchen','dani','chenxue','limo','jiahui'].sort(()=>Math.random()-.5).slice(0,3);
  let delay=700;
  openers.forEach(k=>{
    setTimeout(()=>showTyping(k,()=>addMsg(k,pick(PERSONAS[k].ep))),delay);
    delay+=1800+Math.random()*900;
  });
  setTimeout(()=>showTyping('shanyu',()=>{
    addMsg('shanyu',pick(PERSONAS.shanyu.train));
    setTimeout(()=>{showChips();addNudge();birthdayBeat();parentHookBeat();},700);
  }),delay+400);
}
/* ---------- 家长问题·剧情植入节拍 ---------- */
const TALENT_CHAR={'思者':'yuchen','赢者':'chenxue','德者':'dani','行者':'limo','学者':'jiahui'};
const HOOK_LINES={
 '厌学不想学':[['{t}','说实话，我今天练得也不太情愿。但我后来想通了——我不是因为喜欢才练的，{mot}。'],
  ['dani','对！而且我们已经拉过钩了🐶'],
  ['shanyu','孩子，一天一笔就好。字不勉强人，人也别勉强自己。']],
 '不写作业/磨蹭':[['{t}','我以前能拖到熄灯前一分钟。后来我就跟自己约定：{mot}。结果每次都停不下来。'],
  ['chenxue','就这？我现在开局就冲线，十分钟收工😏'],
  ['dani','拉钩！今晚就试一次，骗人是小狗🐶']],
 '上课发呆走神':[['yuchen','老师又说我上课发呆。可我发现发呆分两种——脑子空白是漏了，脑子在跑是天赋。我现在给每句话配画面，配着配着就没空走神了。'],
  ['jiahui','画面化记忆，笔记第3页也是这个原理📒'],
  ['{t}','明天我也试试，就试一节课。']],
 '不听音频/不打卡':[['limo','桩不骗人。站了就是站了，没站就是没站。打卡不是交差——是每天跟自己见一次面。'],
  ['{t}','{mot}'],
  ['dani','我在频道等你今天的打卡！拉钩！']],
 '畏难怕输':[['chenxue','怕输不丢人，怕说明你真想赢。我的规矩：难题当前，先碰它一下。输了才知道它多重。'],
  ['{t}','{mot}'],
  ['limo','我陪你碰。']],
 '沉迷手机':[['yuchen','手机为什么好玩？因为它每一秒都在给你发奖。看穿了，也就那么回事。'],
  ['{t}','{mot}'],
  ['shanyu','看得破，才放得下。']],
 '玻璃心':[['dani','会难过，说明你在乎"好"呀。眼泪是信使，它在提醒你这里有你在乎的东西。'],
  ['{t}','{mot}'],
  ['shanyu','接住它，再问它：你想提醒我什么？']],
 '不自信':[['jiahui','世上没有"我不行"，只有"还没拆完"。你看我的错题本——错三次的题，我比它还了解它自己。'],
  ['{t}','{mot}'],
  ['dani','你上次明明就做到了！我记得！']],
 '顶嘴叛逆':[['chenxue','我也不爱被人命令。但自己选的，我就做到底。'],
  ['{t}','{mot}'],
  ['shanyu','自己的路，自己选，选了便是。']],
 '作息生活':[['dani','昨晚卧谈会我们说好了，早睡的人才能赢明天！'],
  ['{t}','{mot}'],
  ['limo','熄灯。明天见。']]
};
const TALENT_MOT={
 '思者':'因为我想把这里面的门道想明白，脑子这个东西，喂它故事它就加班',
 '赢者':'因为我们要赢。先超过昨天的自己，再超过那个最瞧不顺眼的家伙——他并不比咱聪明',
 '德者':'因为说好了的，拉过钩的，拉钩的事不能黄',
 '行者':'因为做就完了。桩不骗人，我也不骗人',
 '学者':'因为拆开了就不可怕。没有"学不会"，只有"还没拆完"'
};
function parentHookBeat(){
  let hooks;try{hooks=JSON.parse(localStorage.getItem('jn_parent_hooks')||'[]');}catch(e){return;}
  if(!hooks||!hooks.length)return;
  const h=hooks.shift(); /* 取最早一条，生效一次即出队 */
  localStorage.setItem('jn_parent_hooks',JSON.stringify(hooks));
  const lines=HOOK_LINES[h.cat]||HOOK_LINES['不写作业/磨蹭'];
  const tChar=TALENT_CHAR[h.talent]||'dani';
  const mot=TALENT_MOT[h.talent]||TALENT_MOT['德者'];
  let dl=1600;
  lines.forEach(([k,t])=>{
    const key=k==='{t}'?tChar:k;
    const text=t.replace('{mot}',mot);
    setTimeout(()=>showTyping(key,()=>addMsg(key,text)),dl);
    dl+=1900+Math.random()*500;
  });
}
/* ---------- 生日互动节拍 ---------- */
function birthdayBeat(){
  if(typeof BD==='undefined')return;
  let dl=1400;
  if(BD.isToday()){
    /* 生日当天：全组专属剧情祝福+盲盒发放预告 */
    addSys('🎂 今天是一年中最重要的日子——你的生日！');
    const seq=[
      ['shanyu','孩子，生辰快乐。又长一岁，桩功也长了一分。为师为你备了一份礼，去看。'],
      ['dani','生日快乐！！🎂 拉过钩的，今天许愿一定灵！'],
      ['chenxue','生日限定盲盒……说实话，我都有点羡慕了。'],
      ['yuchen','我昨晚就想好祝福了，躺床上想的，想了一整夜🌙'],
      ['limo','生日快乐。新的一岁，我陪你练。']
    ];
    seq.forEach(([k,t])=>{setTimeout(()=>showTyping(k,()=>addMsg(k,t)),dl);dl+=1900;});
    setTimeout(()=>{
      const d=document.createElement('div');
      d.className='msg sys';
      d.innerHTML=`<div class="mb">🎁 <b>生日限定礼物已送达</b>：「五桩合体 · 武者盲盒」限量小人一枚（带独立编号，仅生日/特殊任务可得）。<br><a href="birthday.html" style="color:#FFD76F;font-weight:900">查看我的生日档案 →</a></div>`;
      $('msgs').appendChild(d);scrollChat();
    },dl+300);
  }else if(BD.isSet()){
    const n=BD.daysUntil();
    if(n<=30){
      setTimeout(()=>showTyping('dani',()=>addMsg('dani',`偷偷告诉你👀 再过 <b>${n}</b> 天就是你生日了，大家已经在准备惊喜了…拉钩，不许说出去！`)),dl);
      dl+=1900;
      setTimeout(()=>showTyping('shanyu',()=>addMsg('shanyu','生辰将近。好好练功，生日那天，自有你的礼物。')),dl);
    }
  }else{
    /* 未登记：引导录入（终身一次） */
    setTimeout(()=>showTyping('dani',()=>addMsg('dani','对了！你登记生日了吗？登记后生日能领<b>限量版武者盲盒</b>，只有生日才拿得到！<br><a href="birthday.html" style="color:#FFD76F;font-weight:900">去登记生日（终身只能登记一次哦）→</a>')),dl);
  }
}
/* ---------- 快捷话题（破冰） ---------- */
const CHIPS=['这集你印象最深的是什么？','今晚站桩谁跟我一组？','我觉得我站不住怎么办？','师父，十桩功最难的是哪一桩？'];
function showChips(){
  $('replies').style.display='flex';
  $('replies').innerHTML=CHIPS.map(c=>`<div class="rp" onclick="quickSay('${c}')">${c}</div>`).join('');
}
function quickSay(t){ $('inp').value=''; addMe(t); respond(t); }
/* ---------- 自由对话引擎：意图路由 + 人格回复 + 主线牵引 ---------- */
function detectIntent(t){
  for(const it of INTENTS)if(it.re.test(t))return it.k;
  return 'off';
}
function pickResponder(intent){
  // 导师定期定调；其余按意图+随机选人，避免同一人连续说
  const pool={train:['limo','jiahui','chenxue','dani'],feel:['dani','shanyu','jiahui'],ep:['yuchen','chenxue','jiahui','dani'],greet:['dani','yuchen','chenxue'],off:['yuchen','dani','chenxue','jiahui','limo']}[intent]||['yuchen','dani'];
  let k=pick(pool),guard=0;
  while(k===lastResponder&&guard++<5)k=pick(pool);
  lastResponder=k;
  return k;
}
let chatRounds=0;
function respond(userText){
  /* 生日意图：优先接管 */
  if(/生日|礼物|盲盒/.test(userText)&&typeof BD!=='undefined'){
    msgCount++;
    const k=pick(['dani','shanyu','chenxue']);
    setTimeout(()=>showTyping(k,()=>{
      let t;
      if(!BD.isSet())t='你还没登记生日呢！登记后生日能领限量武者盲盒🎁 → <a href="birthday.html" style="color:#FFD76F;font-weight:900">去登记</a>（终身只能登记一次）';
      else if(BD.isToday())t='今天是你的生日呀！礼物已经送达，去看生日档案🎂';
      else t=`距离你生日还有 <b>${BD.daysUntil()}</b> 天，礼物已经安排上了，安心练功等着吧😎`;
      addMsg(k,t);chatRounds++;
    }),700);
    return;
  }
  const intent=detectIntent(userText);
  const k=pickResponder(intent);
  msgCount++;
  setTimeout(()=>showTyping(k,()=>{
    addMsg(k,pick(PERSONAS[k][intent]||PERSONAS[k].off));
    chatRounds++;
    // 每3-4轮，导师/另一角色把话题轻轻拉回主线（不强制）
    if(chatRounds%3===0){
      const steerer=k==='shanyu'?'limo':'shanyu';
      setTimeout(()=>showTyping(steerer,()=>{
        addMsg(steerer,pick(PERSONAS[steerer].off));
        if(chatRounds>=6)addNudge();
      }),1200+Math.random()*600);
    }
  }),600+Math.random()*500);
}
function sendFree(){
  const t=$('inp').value.trim();
  if(!joined||!t)return;
  $('inp').value=''; addMe(t); respond(t);
}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendFree();});
/* ---------- 初始化 ---------- */
startTeaser();
</script>
