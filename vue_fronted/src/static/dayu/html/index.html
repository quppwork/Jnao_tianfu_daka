  .hero{
    position:relative;
    display:block;
    margin:6px 18px 0;
    width:auto;
    max-width:none;
    box-sizing:border-box;
    aspect-ratio:1125/480;

  }
  .hero-p{position:absolute;bottom:0}

  .hero-p.zy{left:4.3%;height:93%;filter:drop-shadow(0 8px 12px rgba(6,10,24,.5))}
  /* 卡通：保留呼吸浮动，配合同步地面投影 */
  .hero-p.ct{left:22.2%;height:82%;bottom:1.2%;animation:heroFloat 3.6s ease-in-out infinite;animation-delay:-1.8s;filter:drop-shadow(6px 10px 10px rgba(6,10,24,.55))}

<script>
(function(){
  function readLight(){
    try{
      var t = localStorage.getItem('jnao_theme');
      if(t === 'dark' || t === 'dk') return false;
      if(t === 'white' || t === 'lt') return true;
      var jn = localStorage.getItem('jn_theme');
      if(jn === 'dk') return false;
      if(jn === 'lt') return true;
    }catch(e){}
    return true; /* 与 App 默认白主题一致 */
  }
  function paintThemeBtn(light){
    document.querySelectorAll('.themebtn').forEach(function(b){
      b.textContent = light ? '☀️' : '🌙';
      b.setAttribute('aria-label', light ? '切换深色' : '切换浅色');
    });
  }
  function applyTheme(light, notifyParent){
    var h = document.documentElement;
    if(light) h.classList.add('lt'); else h.classList.remove('lt');
    try{
      localStorage.setItem('jn_theme', light ? 'lt' : 'dk');
      localStorage.setItem('jnao_theme', light ? 'white' : 'dark');
    }catch(e){}
    paintThemeBtn(light);
    if(notifyParent){
      try{
        if(window.parent && window.parent !== window){
          window.parent.postMessage({type:'dayu-theme', light: !!light}, '*');
        }
      }catch(e){}
    }
  }
  var light0 = readLight();
  applyTheme(light0, false);
  window.__dayuApplyTheme = applyTheme;
  window.toggleTheme = function(){ applyTheme(!document.documentElement.classList.contains('lt'), true); };
})();
</script>

<script>

      if(window.parent && window.parent !== window){
        var msg = Object.assign({type: type}, extra || {});
        window.parent.postMessage(msg, '*');
        return true;
      }
    }catch(e){}
    return false;
  }
  function setNickname(name){
    var n = String(name || '学员').trim() || '学员';

    var p = document.getElementById('welcomeP');
    if(p && !p.getAttribute('data-custom')){
      p.innerHTML = n + '，你好！我是张宇老师的智能体——<b>大宇智能体</b>，你的专属 AI 教练。点「天赋测试」开始，测完回来我帮你看结果！';
    }
  }
  function applyHydrate(data){
    if(!data) return;
    if(data.nickname) setNickname(data.nickname);
    if(data.situationLabel){
      var tag = document.getElementById('todayTag');
      if(tag) tag.textContent = '今日：' + data.situationLabel;
    }
    if(data.welcome){
      var p = document.getElementById('welcomeP');
      if(p){
        p.setAttribute('data-custom', '1');
        p.textContent = data.welcome;
      }
    }
    if(data.theme === 'white' || data.theme === 'dark'){
      if(window.__dayuApplyTheme) window.__dayuApplyTheme(data.theme === 'white', false);
    }
  }
  var btnParent = document.getElementById('btnParent');
  if(btnParent){
    btnParent.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      if(!post('dayu-parent')) location.href = '/pages/login/index?role=parent';
    });
  }
  var btnAccount = document.getElementById('btnAccount');
  if(btnAccount){
    btnAccount.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      post('dayu-account');
    });
  }
  window.addEventListener('message', function(ev){
    var data = ev && ev.data;
    if(!data || data.type !== 'dayu-hydrate') return;
    applyHydrate(data);
  });
  post('dayu-ready');
})();
</script>

<script>
(function(){
  function nav(path){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({type:'dayu-nav', path: path}, '*');
        return;
      }
    }catch(e){}
    location.href = path;
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a');
    if(!a) return;
    var href = a.getAttribute('href') || '';
    if(!href || href.indexOf('javascript:')===0 || href.charAt(0)==='#') return;
    var file = href.split('?')[0].split('#')[0].split('/').pop();
    var map = {'index.html': '/pages/dayu/home', 'train.html': '/pages/training/dayu', 'answer.html': '/pages/qa/dayu', 'drama.html': '/pages/hub/academy', 'milestone.html': '/pages/hub/console', 'test.html': '/pages/talent/hub', 'history.html': '/pages/hub/story', 'courses.html': '/pages/hub/courses', 'parent.html': '/pages/login/index?role=parent', 'wallet.html': '/pages/hub/console', 'records.html': '/pages/talent/index?history=1', 'report-v3.html': '/pages/report/index?mode=adult', 'report-kid.html': '/pages/report/index?mode=kid', 'plan.html': '/pages/plan/dayu', 'relation.html': '/pages/talent/hub?stub=relation', 'birthday.html': '/pages/hub/console'};
    if(map[file] || map[href]){
      e.preventDefault();
      e.stopPropagation();
      nav(map[file] || map[href]);
    }
  }, true);
  // personal test expand -> go real talent
  window.__dayuGoTalent = function(){ nav('/pages/talent/index'); };
})();
</script>
