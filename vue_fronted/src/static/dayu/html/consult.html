<style>

.phone{

.ptop{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}

.ag{flex:none;width:76px;text-align:center;cursor:pointer}
.ag .av{width:56px;height:56px;border-radius:50%;margin:0 auto 5px;border:2px solid #2A3040;display:flex;align-items:center;justify-content:center;font-size:26px;background:#171E2E;position:relative;transition:border-color .2s;overflow:hidden;background-size:cover;background-position:center 18%}
.ag .av.face{color:transparent;font-size:0}
.ag.on .av{border-color:#C9A227;box-shadow:0 0 14px rgba(201,162,39,.4)}
.ag .av i{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#3FB950;border:2px solid #0D111F;z-index:2}
.ag span{font-size:10.5px;color:#8B93A5;font-weight:700;display:block}
.ag.on span{color:#F5D9A8}

.ag.pulse .av::before{content:"留言";position:absolute;top:-8px;right:-10px;z-index:3;font-size:8px;font-weight:900;color:#0D111F;background:linear-gradient(90deg,#F5D576,#C9A869);border-radius:99px;padding:2px 7px;animation:agp 1.4s ease-in-out infinite}

@keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.35);opacity:0}}
.gbar{margin:10px 18px 0;background:#131926;border:1.5px solid #2A3040;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:11px;color:#8B93A5}

.duty .dinf{flex:1;min-width:0}
.duty .dinf b{font-size:14px;font-weight:900;color:#D8DCE6}

.duty .dinf span{display:block;font-size:10px;color:#8B93A5;margin-top:2px}
.duty .dbtn{flex:none;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(90deg,#F08A8A,#E05252);border-radius:99px;padding:8px 15px;text-decoration:none;border:none;cursor:pointer}
.cv-t{margin:14px 18px 8px;font-size:12px;font-weight:800;color:#8B93A5;display:flex;align-items:center;gap:8px}
.cv-t b{color:#F5D9A8;font-size:13.5px}
.msgs{margin:0 18px}
.msg{display:flex;gap:9px;margin-bottom:14px}
.msg .av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid;position:relative;overflow:hidden;background-size:cover;background-position:center 18%}
.msg .av.face{color:transparent;font-size:0}
.tx.think{display:flex;align-items:center;gap:6px;min-width:56px}
.tx.think i{width:6px;height:6px;border-radius:50%;background:#C9A869;opacity:.3;animation:tdot 1.05s ease-in-out infinite}
.tx.think i:nth-child(2){animation-delay:.18s}
.tx.think i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.fups{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fups button{border:1px solid rgba(201,162,39,.45);background:rgba(201,162,39,.1);color:#F5D9A8;font-size:11px;font-weight:800;border-radius:99px;padding:6px 10px;cursor:pointer;font-family:inherit}
.fups button:active{opacity:.75}
.livebar{margin:8px 18px 0;font-size:11px;font-weight:800;color:#C9A869;display:none}
.livebar.on{display:block}
.msg .bd{max-width:80%}
.msg .who{font-size:10.5px;color:#8B93A5;margin-bottom:3px}
.msg .who i{font-style:normal;font-size:9px;border:1px solid;border-radius:5px;padding:0 6px;margin-left:5px}
.msg .tx{background:#171E2E;border:1px solid #2A3040;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:13px;color:#D8DCE6;line-height:1.65;word-break:break-word}
.msg .tx b,.msg .tx strong{color:#F5D9A8;font-weight:800}
.msg .tx em{font-style:italic;color:#B8C0D0}
.msg .tx.chat-rich .gd-p{margin:0 0 10px}
.msg .tx.chat-rich .gd-p:last-child{margin-bottom:0}
.msg .tx.chat-rich .gd-h{margin:12px 0 8px;font-weight:800;color:#EDEBE4;line-height:1.45}
.msg .tx.chat-rich .gd-h1{font-size:15px}.msg .tx.chat-rich .gd-h2{font-size:14px}.msg .tx.chat-rich .gd-h3,.msg .tx.chat-rich .gd-h4{font-size:13px}
.msg .tx.chat-rich .gd-h:first-child,.msg .tx.chat-rich .gd-sec:first-child,.msg .tx.chat-rich .gd-p:first-child{margin-top:0}
.msg .tx.chat-rich .gd-sec{margin:12px 0 6px;padding-left:10px;border-left:3px solid #C9A227;color:#F5D9A8;font-weight:800;font-size:13px;line-height:1.5}
.msg .tx.chat-rich .gd-ul,.msg .tx.chat-rich .gd-ol{margin:6px 0 10px;padding-left:1.25em}
.msg .tx.chat-rich .gd-ul{list-style:disc}.msg .tx.chat-rich .gd-ol{list-style:decimal}
.msg .tx.chat-rich .gd-ul li,.msg .tx.chat-rich .gd-ol li{margin:4px 0;padding-left:2px}
.msg .tx.chat-rich .gd-quote{margin:8px 0 10px;padding:8px 10px;border-left:3px solid rgba(154,217,255,.45);background:rgba(46,107,230,.08);border-radius:0 8px 8px 0;color:#B8C0D0}
.msg .tx.chat-rich .gd-quote p{margin:0 0 4px}.msg .tx.chat-rich .gd-quote p:last-child{margin-bottom:0}
.msg .tx.chat-rich .gd-hr{margin:12px 0;border:none;border-top:1px solid #2A3040}

.msg.me .who{text-align:right}

.sys i{font-style:normal;background:#131926;border:1px solid #232B3D;border-radius:99px;padding:4px 12px}
.board{margin:4px 18px 0;background:#131926;border:1.5px solid rgba(201,162,39,.4);border-radius:16px;padding:13px}
.board .bt{font-size:14px;font-weight:900;margin-bottom:10px;color:#F5D9A8}
.board .bt span{font-size:10px;color:#8B93A5;font-weight:700;margin-left:6px}
.bmsg{margin-bottom:10px}
.bq{font-size:12px;color:#D8DCE6;background:#171E2E;border:1px solid #2A3040;border-radius:4px 12px 12px 12px;padding:9px 12px;line-height:1.6}
.bq small{display:block;font-size:9px;color:#5A6274;margin-top:4px}
.ba{font-size:12px;color:#E8DFC8;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.3);border-radius:12px 4px 12px 12px;padding:9px 12px;line-height:1.6;margin-top:6px;margin-left:18px}
.ba small{display:block;font-size:9px;color:#8B93A5;margin-top:4px}
.bin{display:flex;gap:8px;margin-top:6px}
.bin input{flex:1;background:#0D111F;border:1.5px solid #2A3040;border-radius:99px;padding:9px 14px;font-size:12px;color:#EDEBE4;outline:none}
.bin button{flex:none;font-size:12px;font-weight:900;color:#0D111F;background:linear-gradient(90deg,#F5D576,#C9A869);border-radius:99px;padding:9px 16px;border:none;cursor:pointer}
.qs{display:none!important}
.chat-dock{
  position:fixed;bottom:calc(56px + env(safe-area-inset-bottom, 0px));
  left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--app-max-width, 480px);
  z-index:40;background:#161b26;border-top:1px solid #232b3d
}
.plus-panel{
  display:none;padding:12px 10px 6px;border-bottom:1px solid #232b3d;
  grid-template-columns:repeat(4,1fr);gap:10px
}
.plus-panel.on{display:grid}
.plus-cell{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 4px;border:none;background:transparent;cursor:pointer;color:#B8C0D0
}
.plus-cell .ic{
  width:52px;height:52px;border-radius:14px;background:#1c2333;border:1px solid #2a3040;
  display:flex;align-items:center;justify-content:center;font-size:22px
}
.plus-cell span{font-size:11px;font-weight:700;color:#8B93A5}
.inpbar{
  position:static;transform:none;left:auto;bottom:auto;width:100%;max-width:none;

.inpbar .tool{
  width:36px;height:36px;flex:none;border:none;background:transparent;padding:0;

.inpbar .tool svg{width:26px;height:26px;display:block}
.inpbar .box-wrap{flex:1;min-width:0}
.inpbar .box{
  display:block;width:100%;min-height:36px;max-height:96px;resize:none;
  background:#0f1420;border:none;border-radius:8px;
  padding:8px 12px;font-size:15px;line-height:1.35;color:#EDEBE4;

}
.inpbar .box::placeholder{color:#5A6274}
.inpbar .send-txt{

  display:none;align-items:center;justify-content:center
}
.inpbar.has-text .send-txt{display:flex}
.inpbar.has-text .tool.plus{display:none}
.inpbar .tool.plus.on{color:#F5D9A8}
.foot{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:var(--app-max-width, 480px);margin:0 auto;background:rgba(13,17,31,.96);backdrop-filter:blur(12px);border-top:1px solid #232B3D;padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));display:flex;justify-content:space-around;z-index:50;box-sizing:border-box}.foot a{text-align:center;color:#8B93A5;font-size:11px;flex:1;text-decoration:none;padding:0}.foot a.on{color:#F5D9A8;font-weight:700}.foot a img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 1px}
.errbanner{margin:8px 18px;padding:10px 12px;border-radius:12px;background:rgba(224,82,82,.15);border:1px solid rgba(224,82,82,.45);color:#F08A8A;font-size:12px;font-weight:700}
.at-panel{

.at-panel.on{display:flex}

.at-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.at-item:active,.at-item.on{background:rgba(201,162,39,.12)}

.msg .av{cursor:pointer;-webkit-user-select:none;user-select:none}
.ag .av{cursor:pointer;-webkit-user-select:none;user-select:none}

  function parseFollowups(content){
    var raw = String(content || '');
    var idx = -1;
    var markers = ['如果你还想了解', '你可能还想', '还可以继续问', '想进一步了解'];
    for(var i=0;i<markers.length;i++){
      var p = raw.indexOf(markers[i]);
      if(p >= 0 && (idx < 0 || p < idx)) idx = p;
    }
    if(idx < 0) return [];
    var tail = raw.slice(idx);
    var lines = tail.split(/\n+/);
    var chips = [];
    for(var j=0;j<lines.length;j++){
      var line = lines[j].replace(/^[\s*•\-\d.、]+/, '').replace(/[？?。.]+$/, '').trim();
      if(!line || line.length < 4 || line.length > 36) continue;
      if(markers.some(function(m){ return line.indexOf(m) === 0; })) continue;
      chips.push(line);
      if(chips.length >= 3) break;
    }
    return chips;
  }

  function insertMentionText(name){
    var inp = document.getElementById('inp');
    if(!inp || !name) return;
    var v = inp.value || '';
    var caret = typeof inp.selectionStart === 'number' ? inp.selectionStart : v.length;
    var token = '@' + name + ' ';
    var start = atReplaceFrom;
    if(start < 0){
      // 找光标前最近的 @
      var before = v.slice(0, caret);
      start = before.lastIndexOf('@');
      if(start < 0) start = caret;
    }
    var end = caret;
    // 替换 @ 后的过滤片段
    var next = v.slice(0, start) + token + v.slice(end);
    inp.value = next;
    var pos = start + token.length;
    try{ inp.setSelectionRange(pos, pos); }catch(e){}
    inp.focus();
    hideAtPanel();
    try{ syncSendUi(); }catch(e){}
  }

  function bindLongPress(el, onLong, onShort){
    if(!el) return;
    function clear(){
      if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
    }
    function start(ev){
      longPressMoved = false;
      clear();
      longPressTimer = setTimeout(function(){
        longPressTimer = null;
        suppressClickUntil = Date.now() + 600;
        try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
        onLong && onLong(ev);
      }, 420);
    }
    function move(){ longPressMoved = true; clear(); }
    function end(ev){
      var wasTiming = !!longPressTimer;
      clear();
      if(wasTiming && !longPressMoved && Date.now() > suppressClickUntil){
        onShort && onShort(ev);
      }
    }
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', clear);
    el.addEventListener('pointerleave', clear);
    el.addEventListener('click', function(e){
      if(Date.now() < suppressClickUntil){
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  }

  function connectWs(){
    var uid = parentUserId();
    var tok = accessToken();
    if(!uid || !tok){ setWsDot(false, '未登录'); return; }
    try{ if(ws){ ws.onclose=null; ws.close(); } }catch(e){}
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var url = proto + '//' + location.host + '/api/parent/consult/ws?user_id=' +
      encodeURIComponent(uid) + '&token=' + encodeURIComponent(tok);
    ws = new WebSocket(url);
    ws.onopen = function(){ setWsDot(true, '实时'); };
    ws.onclose = function(){
      setWsDot(false, '重连中');
      clearTimeout(wsTimer);
      wsTimer = setTimeout(connectWs, 3000);
    };
    ws.onerror = function(){ setWsDot(false, '异常'); };
    ws.onmessage = function(ev){
      var data;
      try{ data = JSON.parse(ev.data); }catch(e){ return; }
      if(!data || !data.type) return;
      if(data.type === 'message.new' && data.message){
        ingestMessage(data.conversation_id, data.message, true);
      }else if(data.type === 'board.updated' && data.channel_code){
        boardPulse[data.channel_code] = true;
        if(data.channel_code === curCode) loadBoard(curCode);
        renderRow();
      }else if(data.type === 'hello'){
        var c = curConv();

          ws.send(JSON.stringify({type:'subscribe', conversation_id: c.id}));
        }
      }
    };
  }

  function ingestMessage(conversationId, m, rerender){
    if(!m) return;
    if(isStubMessage(m)) return;
    var list = msgsByConv[conversationId] || (msgsByConv[conversationId] = []);
    if(m.client_msg_id){
      var idx = -1;
      for(var i=0;i<list.length;i++){
        if(list[i].client_msg_id === m.client_msg_id){ idx = i; break; }
      }
      if(idx >= 0){
        list[idx] = Object.assign({}, list[idx], m, { pending: false });
        if(m.id) seenMsgIds[m.id] = 1;
        if(rerender) renderMsgs();
        return;
      }
    }
    if(m.id && seenMsgIds[m.id]) return;
    if(m.id) seenMsgIds[m.id] = 1;
    list.push(m);
    list.sort(function(a,b){
      var aid = typeof a.id === 'number' ? a.id : 1e15;
      var bid = typeof b.id === 'number' ? b.id : 1e15;
      return aid - bid;
    });
    var conv = curConv();
    if(rerender && conv && conv.id === conversationId) renderMsgs();
  }

          showAtToast('已 @'+name);
        }
      }, null);
    });
    try{
      var sc = document.getElementById('chatScroll');
      if(sc) sc.scrollTop = sc.scrollHeight;
    }catch(e){}
  }

  window.addEventListener('jnao-rich-ready', function(){
    try{ renderMsgs(); }catch(e){}
  });

  function renderBoard(){
    var ch = curChannel();
    var bd = document.getElementById('cvBoard');
    if(!ch || !ch.board_enabled){ bd.innerHTML=''; return; }
    var posts = boardByCode[ch.code] || [];
    var html = '<div class="board"><div class="bt">📝 '+esc(ch.title)+' · 留言板<span>老师看到必回</span></div>';
    if(!posts.length){
      html += '<div class="sys" style="margin:0 0 8px"><i>暂无留言</i></div>';
    }else{
      posts.forEach(function(p){
        html += '<div class="bmsg"><div class="bq">'+esc(p.body)+
          '<small>'+esc(p.created_at||'')+' · '+esc(p.status||'')+'</small></div>';
        if(p.reply_body){
          html += '<div class="ba"><b>导师回复：</b>'+esc(p.reply_body)+
            '<small>'+esc(p.updated_at||'')+'</small></div>';
        }
        html += '</div>';
      });
    }
    html += '<div class="bin"><input id="boardInp" placeholder="给'+esc(ch.title)+'留言…"/>'+
      '<button type="button" id="boardSend">提交</button></div></div>';
    bd.innerHTML = html;
    var btn = document.getElementById('boardSend');
    if(btn) btn.onclick = submitBoard;
  }

  async function loadBoard(code){
    try{
      var data = await api('GET', '/api/parent/consult/board?channel_code='+encodeURIComponent(code));
      boardByCode[code] = data.posts || [];
      var hasReply = (boardByCode[code]||[]).some(function(p){ return p.reply_body; });
      if(hasReply) boardPulse[code] = true;
      if(code === curCode){ boardPulse[code] = false; renderBoard(); renderRow(); }
    }catch(e){ /* 静默 */ }
  }

  async function submitBoard(){
    var inp = document.getElementById('boardInp');
    var body = (inp && inp.value || '').trim();
    if(!body) return;
    var conv = curConv();
    try{
      await api('POST', '/api/parent/consult/board', {
        channel_code: curCode,
        body: body,
        conversation_id: conv ? conv.id : null,
      });
      if(inp) inp.value = '';
      await loadBoard(curCode);
    }catch(e){ showErr(e.message || '留言失败'); }
  }

  async function openConv(code){
    var data = await api('POST', '/api/parent/consult/conversations/open', { channel_code: code });
    convByCode[code] = data.conversation;
    var cid = data.conversation.id;
    msgsByConv[cid] = [];
    seenMsgIds = {};
    var hist = await api('GET', '/api/parent/consult/conversations/'+cid+'/messages?limit=100');
    (hist.messages || []).forEach(function(m){ ingestMessage(cid, m, false); });
    if(ws && ws.readyState === 1){
      ws.send(JSON.stringify({type:'subscribe', conversation_id: cid}));
    }
    // 刷新群人数条
    try{
      var chs = await api('GET', '/api/parent/consult/channels');
      window.__consultGroupBar = chs.group_bar || null;
      renderMeta();
    }catch(e){}
  }

  async function pick(code){
    if(!code) return;
    curCode = code;
    boardPulse[code] = false;
    showErr('');
    renderRow();
    renderMeta();
    renderChips();
    var ch = curChannel();
    var tip = (ch && ch.kind === 'group')
      ? '群里发言，@大宇 提问；@顾问可指引去单独咨询…'
      : ('发消息给 '+(ch && ch.title || '')+'…');
    document.getElementById('inp').placeholder = tip;
    hideAtPanel();
    renderMsgs();
    try{
      await openConv(code);
      renderMsgs();
      await loadBoard(code);
      renderBoard();
    }catch(e){
      showErr(e.message || '打开会话失败');
    }
  }

  async function sendMsg(){
    if(sending) return;
    var v = document.getElementById('inp').value.trim();
    if(!v) return;
    var conv = curConv();
    if(!conv){ showErr('会话未就绪'); return; }
    sending = true;
    document.getElementById('inp').value = '';
    syncSendUi();
    var clientId = 'c-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
    var thinkId = 'think-'+clientId;
    var temp = {
      id: 'tmp-'+clientId,
      client_msg_id: clientId,
      sender_role: 'parent',
      sender_user_id: parentUserId(),
      sender_name: '我',
      is_me: true,
      content: v,
      content_type: 'text',
      pending: true,
    };
    ingestMessage(conv.id, temp, true);
    var thinkMsg = {
      id: thinkId,
      client_msg_id: thinkId,
      sender_role: 'bot',
      sender_name: (curChannel() && curChannel().title) || '顾问',
      content: '',
      thinking: true,
      meta: { persona_code: curCode },
    };
    ingestMessage(conv.id, thinkMsg, true);
    setLiveBar(true, '顾问正在思考…');
    try{
      var data = await api('POST', '/api/parent/consult/conversations/'+conv.id+'/messages', {
        content: v,
        client_msg_id: clientId,
      });
      var list = msgsByConv[conv.id] || [];
      msgsByConv[conv.id] = list.filter(function(m){ return m.id !== thinkId && m.client_msg_id !== thinkId; });
      if(data.message) ingestMessage(conv.id, data.message, false);
      if(data.bot_message) ingestMessage(conv.id, data.bot_message, false);
      renderMsgs();
    }catch(e){
      showErr(e.message || '发送失败');
      // 去掉 pending / 思考中气泡
      var list2 = msgsByConv[conv.id] || [];
      msgsByConv[conv.id] = list2.filter(function(m){
        if(m.id === thinkId || m.client_msg_id === thinkId) return false;
        return m.client_msg_id !== clientId || !m.pending;
      });
      renderMsgs();
      document.getElementById('inp').value = v;
      syncSendUi();
    }finally{
      setLiveBar(false);
      sending = false;
    }
  }

  async function boot(){
    var uid = parentUserId();
    if(!uid || !accessToken()){
      showErr('请先登录家长账号');
      setWsDot(false, '未登录');
      return;
    }
    try{
      var data = await api('GET', '/api/parent/consult/channels');
      channels = data.channels || [];
      window.__consultDuty = data.duty || null;
      window.__consultGroupBar = data.group_bar || null;
      if(!channels.length){
        showErr('暂无咨询频道，请稍后或联系管理员');
        return;
      }
      if(!channels.find(function(c){ return c.code === curCode; })){
        curCode = channels[0].code;
      }
      renderRow();
      connectWs();
      await pick(curCode);
    }catch(e){
      showErr(e.message || '加载频道失败');
    }
  }

  document.getElementById('btnSend').addEventListener('click', sendMsg);
  var inpEl = document.getElementById('inp');
  var inpBar = document.getElementById('inpBar');
  var plusPanel = document.getElementById('plusPanel');
  var btnPlus = document.getElementById('btnPlus');

  function syncSendUi(){
    var has = !!(inpEl && String(inpEl.value || '').trim());
    if(inpBar) inpBar.classList.toggle('has-text', has);
    if(has) hidePlusPanel();
    autoGrowInp();
  }
  function autoGrowInp(){
    if(!inpEl) return;
    inpEl.style.height = 'auto';
    var h = Math.min(96, Math.max(36, inpEl.scrollHeight));
    inpEl.style.height = h + 'px';
  }
  function hidePlusPanel(){
    if(plusPanel){
      plusPanel.classList.remove('on');
      plusPanel.setAttribute('aria-hidden','true');
    }
    if(btnPlus) btnPlus.classList.remove('on');
  }
  function togglePlusPanel(){
    if(!plusPanel) return;
    var on = !plusPanel.classList.contains('on');
    plusPanel.classList.toggle('on', on);
    plusPanel.setAttribute('aria-hidden', on ? 'false' : 'true');
    if(btnPlus) btnPlus.classList.toggle('on', on);
    if(on) try{ inpEl && inpEl.blur(); }catch(e){}
  }
  function soon(title){
    showAtToast(title || '功能即将开放');
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage({type:'dayu-toast', title: title || '功能即将开放'}, '*');
      }
    }catch(e){}
  }

  inpEl.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ hideAtPanel(); hidePlusPanel(); return; }
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      hideAtPanel();
      hidePlusPanel();
      sendMsg();
    }
  });
  inpEl.addEventListener('input', function(){
    syncSendUi();
    scanAtTrigger();
  });
  inpEl.addEventListener('click', function(){
    hidePlusPanel();
    scanAtTrigger();
  });
  inpEl.addEventListener('focus', function(){ hidePlusPanel(); });
  inpEl.addEventListener('keyup', function(e){
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Home' || e.key === 'End'){
      scanAtTrigger();
    }
  });
  function isSecureMedia(){
    try{ return !!(window.isSecureContext); }catch(e){ return location.protocol === 'https:'; }
  }
  function askParentMedia(action){
    return new Promise(function(resolve, reject){
      if(!window.parent || window.parent === window){
        reject(new Error('no-parent'));
        return;
      }
      var reqId = 'm-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
      var timer = setTimeout(function(){
        window.removeEventListener('message', onMsg);
        reject(new Error('timeout'));
      }, 45000);
      function onMsg(ev){
        var d = ev && ev.data;
        if(!d || d.type !== 'dayu-media-result' || d.reqId !== reqId) return;
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        if(d.ok) resolve(d);
        else reject(new Error(d.error || 'denied'));
      }
      window.addEventListener('message', onMsg);
      try{
        window.parent.postMessage({ type:'dayu-media', action: action, reqId: reqId }, '*');
      }catch(e){
        clearTimeout(timer);
        window.removeEventListener('message', onMsg);
        reject(e);
      }
    });
  }
  function pickImageViaInput(captureMode){
    return new Promise(function(resolve, reject){
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      if(captureMode) input.setAttribute('capture', captureMode);
      input.style.cssText = 'position:fixed;left:-9999px;opacity:0';
      document.body.appendChild(input);
      var done = false;
      function cleanup(){ try{ document.body.removeChild(input); }catch(e){} }
      input.addEventListener('change', function(){
        if(done) return; done = true;
        var file = input.files && input.files[0];
        cleanup();
        if(!file){ reject(new Error('cancel')); return; }
        resolve({ file: file, preview: URL.createObjectURL(file), name: file.name || 'photo.jpg' });
      });
      input.addEventListener('cancel', function(){ if(done) return; done = true; cleanup(); reject(new Error('cancel')); });
      input.click();
    });
  }
  async function ensureMicPermission(){
    if(!isSecureMedia()){
      showErr('语音需 HTTPS 安全环境，系统才会弹出麦克风授权');
      return false;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showErr('当前浏览器不支持麦克风');
      return false;
    }
    try{
      var stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      stream.getTracks().forEach(function(t){ t.stop(); });
      return true;
    }catch(e){
      if(e && e.name === 'NotAllowedError'){
        showErr('麦克风权限被拒绝：请在系统/浏览器弹窗中允许，或到设置里打开');
      }else{
        showErr((e && e.message) || '无法申请麦克风权限');
      }
      return false;
    }
  }
  async function startConsultVoice(){
    if(mediaBusy || sending) return;
    // 优先让父页 UniApp 申请系统权限
    try{
      var parentRes = await askParentMedia('mic');
      if(parentRes && parentRes.text){
        inpEl.value = (inpEl.value ? inpEl.value+' ' : '') + parentRes.text;
        syncSendUi();
        return;
      }
    }catch(e){ /* 回退浏览器 */ }
    if(!(await ensureMicPermission())) return;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR){
      try{
        mediaBusy = true;
        setLiveBar(true, '正在听你说…（系统已授权麦克风）');
        var rec = new SR();
        voiceRec = rec;
        rec.lang = 'zh-CN';
        rec.interimResults = false;
        rec.maxAlternatives = 1;
        rec.onresult = function(ev){
          var text = (ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || '';
          if(text){
            inpEl.value = (inpEl.value ? inpEl.value+' ' : '') + text;
            syncSendUi();
          }
        };
        rec.onerror = function(){ showErr('语音识别失败，可改打字'); };
        rec.onend = function(){ mediaBusy = false; setLiveBar(false); voiceRec = null; };
        rec.start();
        return;
      }catch(err){
        mediaBusy = false;
        setLiveBar(false);
      }
    }
    showErr('已授权麦克风。当前环境无语音识别引擎，请改用打字；App 内将走系统录音。');
  }
  async function pickConsultImage(source){
    if(mediaBusy) return;
    hidePlusPanel();
    mediaBusy = true;
    setLiveBar(true, source === 'camera' ? '正在申请相机…' : '正在打开相册…');
    try{
      var got = null;
      try{
        var pr = await askParentMedia(source === 'camera' ? 'camera' : 'album');
        if(pr && (pr.preview || pr.path || pr.dataUrl)){
          got = { preview: pr.preview || pr.path || pr.dataUrl, name: pr.name || 'image.jpg' };
        }
      }catch(e){ /* H5 fallback */ }
      if(!got){
        got = await pickImageViaInput(source === 'camera' ? 'environment' : '');
      }
      if(!got) return;
      // 咨询图暂以说明文案发送（后端图文通道后续可接）；本地先预览提醒
      var tip = source === 'camera'
        ? '【拍照】我发来一张图片，请结合孩子天赋与因材施教帮我看看怎么沟通/引导（若是学科题请提示去答疑）。'
        : '【相册】我发来一张图片，请结合孩子天赋与因材施教帮我看看怎么沟通/引导（若是学科题请提示去答疑）。';
      inpEl.value = tip;
      syncSendUi();
      // 会话里插入本地预览气泡
      var conv = curConv();
      if(conv && got.preview){
        ingestMessage(conv.id, {
          id: 'img-local-'+Date.now(),
          sender_role: 'parent',
          sender_user_id: parentUserId(),
          is_me: true,
          content: '[图片] '+ (got.name || ''),
          content_type: 'image',
          image_url: got.preview,
        }, true);
      }
      showErr('');
      uniToast('已选图，确认文案后发送');
    }catch(e){
      if((e && e.message) !== 'cancel') showErr((e && e.message) || '选图失败');
    }finally{
      mediaBusy = false;
      setLiveBar(false);
    }
  }
  function uniToast(title){
    try{ window.parent && window.parent.postMessage({ type:'dayu-toast', title: title }, '*'); }catch(e){}
  }
  document.getElementById('btnVoice').addEventListener('click', function(){ startConsultVoice(); });
  document.getElementById('btnEmoji').addEventListener('click', function(){ soon('表情即将开放'); });
  btnPlus.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    togglePlusPanel();
  });
  plusPanel.querySelectorAll('.plus-cell').forEach(function(el){
    el.addEventListener('click', function(){
      var act = el.getAttribute('data-act');
      if(act === 'at'){
        hidePlusPanel();
        var ch = curChannel();
        if(ch && ch.kind === 'group'){
          var v = inpEl.value || '';
          var caret = typeof inpEl.selectionStart === 'number' ? inpEl.selectionStart : v.length;
          var needAt = !(caret > 0 && v.charAt(caret-1) === '@');
          if(needAt){
            inpEl.value = v.slice(0, caret) + '@' + v.slice(caret);
            try{ inpEl.setSelectionRange(caret+1, caret+1); }catch(err){}
          }
          inpEl.focus();
          syncSendUi();
          scanAtTrigger();
        }else{
          soon('私聊无需 @，直接发消息即可');
        }
        return;
      }
      if(act === 'camera'){ pickConsultImage('camera'); return; }
      if(act === 'album'){ pickConsultImage('album'); return; }
      soon('功能即将开放');
      hidePlusPanel();
    });
  });
  document.addEventListener('click', function(e){
    var t = e.target;
    if(t && t.closest && (t.closest('#atPanel') || t.closest('#inp') || t.closest('#chatDock'))) return;
    hideAtPanel();
    hidePlusPanel();
  });
  syncSendUi();

  boot();
  try{ window.parent && window.parent !== window && window.parent.postMessage({type:'dayu-ready'}, '*'); }catch(e){}
})();
</script>

<script>
(function(){
  function post(type, extra){
    try{
      if(window.parent && window.parent !== window){
        window.parent.postMessage(Object.assign({type:type}, extra||{}), '*');
        return true;
      }
    }catch(e){}
    return false;
  }
  function nav(path){
    if(post('dayu-nav', {path: path})) return;
    location.href = path;
  }
  var btnStudent = document.getElementById('btnStudent');
  if(btnStudent){
    btnStudent.addEventListener('click', function(e){
      e.preventDefault();
      if(!post('dayu-student')) location.href = '/pages/dayu/home';
    });
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a');
    if(!a) return;
    var href = a.getAttribute('href') || '';
    if(!href || href.indexOf('javascript:')===0 || href.charAt(0)==='#') return;
    var file = href.split('?')[0].split('#')[0].split('/').pop();
    var map = {
      'parent.html': '/pages/parent/dayu',
      'pset.html': '/pages/parent/pset',
      'pdata.html': '/pages/parent/pdata',
      'consult.html': '/pages/parent/consult',
      'community.html': '/pages/parent/community',
      'pcourse.html': '/pages/parent/pcourse',
      'kids-manage.html': '/pages/parent/index',
      'wallet.html': '/pages/parent/wallet',
      'console.html': '/pages/parent/console',
      'index.html': '__student__'
    };
    var soon = {
      'records.html': '测试报告即将开放',
      'share.html': '分享推广即将开放',
      'career.html': '招贤纳士即将开放',
      'test.html': '天赋测试即将开放',
      'milestone.html': '中央电脑即将开放'
    };
    if(soon[file]){
      e.preventDefault();
      e.stopPropagation();
      if(!post('dayu-toast', {title: soon[file]})){ try{ alert(soon[file]); }catch(err){} }
      return;
    }
    if(map[file]){
      e.preventDefault();
      e.stopPropagation();
      if(map[file] === '__student__'){
        if(!post('dayu-student')) nav('/pages/dayu/home');
        return;
      }
      nav(map[file]);
    }
  }, true);
})();
</script>
</body></html>
