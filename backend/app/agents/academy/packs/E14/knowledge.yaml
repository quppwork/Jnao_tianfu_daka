episode_id: E14
title: 蒙上眼睛之后
synopsis: >
  田小静圆形无窗感知教室：吸音棉墙、六枚蒲团；戴眼罩耳机蒙眼认卡，灯光渐暗。
  五人摸到/想到不同世界。收课：眼睛关了，世界不会关。
beats:
  - 圆形教室，戴眼罩认卡
  - 灯光渐暗，五人感知不同
  - 王家慧红与黑三角
  - 章宇尘绿草地
  - 陈雪蓝圆
  - 李寞黄方「就是知道」
  - 施丹尼摸到「棱」却被告知卡片是平面
  - 眼睛关了，世界不会关
character_beats:
  yuchen: 关了灯想到绿，绿长成草地——不是卡片绿，是我想到了绿。
  dani: 卡片是平的，搓边却摸到棱；老师说是大脑把指尖信号放大了。
  limo: 黄的，方的。就是知道。为什么，还说不清。
  jiahui: 红粒子里有个黑三角；第一次听见自己的声音发颤。
  chenxue: 蓝的圆的，看得清楚；边上那点联想不重要，掐了。
  shanyu: 这节是田小静的教室；我没上台，只看他们关了眼睛还摸到世界。
