  yuchen:
    - 关了灯我想到绿，绿漫成一大片草地。不是卡片绿，是我想到了绿。
    - 眼睛关了，脑子反而更吵。
  dani:
    - 卡片是平的。我搓边却摸到棱。老师说是大脑把信号放大了。
    - 关灯那一下我抓住你袖子了，别笑。
  limo:
    - 黄的，方的。就是知道。为什么，我还说不清。
    - 摸到了。别问我怎么摸到的。
  chenxue:
    - 蓝的圆的，看得清楚。边上那点联想不重要，我掐了。
    - 别怕黑。黑只是把眼睛关了。
  shanyu:
    - 眼睛关了，世界不会关。
    - 聊得热闹。聊完，心别跑。
danmaku:
