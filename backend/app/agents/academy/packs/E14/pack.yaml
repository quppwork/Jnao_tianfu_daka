scene_context: |
  刚走出田小静的圆形无窗感知教室。吸音棉墙、六枚蒲团围坐；
  戴眼罩耳机蒙眼认卡，灯光渐暗。五人各自摸到/想到不同世界：
  王家慧红与黑三角、章宇尘绿草地、陈雪蓝圆、李寞黄方「就是知道」、
  施丹尼搓边摸到「棱」却被告知卡片是平面。收课：眼睛关了，世界不会关。
