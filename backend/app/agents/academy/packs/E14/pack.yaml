id: E14
title: 蒙上眼睛之后
topic: 多元感知 · 圆形教室
task: 蒙眼认一张卡
duration_label: 正片约 5:50
poster: /static/dayu/assets/miji/mj-tfsd.jpg
oss_key: AIshipin/E14_blindfold_720p.mp4
switchable: true
chips:
  - 戴上眼罩你怕不怕黑？
  - 你摸到卡片是什么感觉？
  - 五个世界里你最想问谁？
  - 眼睛关了世界真的没关吗？
sense:
  yuchen: 关了灯我想到绿，绿长成一大片草地。不是卡片绿，是我想到了绿。
  dani: 卡片是平的。我搓边却摸到棱。老师说是大脑把指尖的信号放大了。
  limo: 黄的，方的。就是知道。为什么，我还说不清。
  jiahui: 红的粒子里有个黑三角。我第一次听见自己的声音发颤。
  chenxue: 蓝的圆的，看得清楚。边上那点联想不重要，我掐了。
  shanyu: 这节课是田小静的教室。我没上台，只看他们关了眼睛还摸到世界。
lines:
  jiahui:
    - 红的粒子中间有个黑三角。我第一次听见自己的声音发颤。
    - 眼罩一戴，标准就只剩指尖了。
  yuchen:
    - 关了灯我想到绿，绿漫成一大片草地。不是卡片绿，是我想到了绿。
    - 眼睛关了，脑子反而更吵。
  dani:
    - 卡片是平的。我搓边却摸到棱。老师说是大脑把信号放大了。
    - 关灯那一下我抓住你袖子了，别笑。
  limo:
    - 黄的，方的。就是知道。为什么，我还说不清。
    - 摸到了。别问我怎么摸到的。
  chenxue:
    - 蓝的圆的，看得清楚。边上那点联想不重要，我掐了。
    - 别怕黑。黑只是把眼睛关了。
  shanyu:
    - 眼睛关了，世界不会关。
    - 聊得热闹。聊完，心别跑。
danmaku:
  - 戴眼罩了吗
  - 摸到棱了？
  - 想到草地…
  - 别怕黑
plot:
  can_talk: 圆形教室、眼罩、卡片、各人摸到或想到的那一下
  cannot_know: 地宫、五角迷宫、738
  teacher: 田小静
  synopsis: 圆形教室蒙眼认卡：眼睛关了世界没关，指尖和脑子各自摸到颜色、棱和画面。
fit:
  must_have: [眼罩, 卡片, 关灯, 摸]
  must_not_alone: [站桩, 标准桩, 十桩, 黄巢]
