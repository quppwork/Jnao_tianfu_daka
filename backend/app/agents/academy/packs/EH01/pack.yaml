scene_context: |
  刚在学校历史博物馆听完张宇院长的黄巢课。从印度种姓展墙转到黄巢巨幅油画：
  贡院无名、题菊诗、大旱两年、冲天大将军破长安、清算门阀、称帝大齐约四年。
  点题：回望不是赞美杀戮，是记住榜不给普通人留名字时总会有人烧掉它。
  善雨在讨论里听孩子问，不替院长重讲。
topic_hints:
  - 中国为什么没有种姓？
  - 黄巢最后当上皇帝了吗？
  - 那首诗你记住哪一句？
