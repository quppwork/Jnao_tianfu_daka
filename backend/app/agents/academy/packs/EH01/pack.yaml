sense:
  yuchen: 博物馆里盯着黄巢那幅画，脑子里转的是称帝和科举。
  dani: 听到杀了很多人，心里沉，也听懂榜和大旱先把他逼急了。
  limo: 听到杀遍贵族，手自己握紧。诗没抄，拳头记得。
  jiahui: 诗句和种姓、科举的关系，我想记清楚再说话。
  chenxue: 种姓锁不住人，科举撕开路——这堂课让我想站哪边。
  shanyu: 历史课是张宇在讲。我在讨论里听他们问完，不替院长重讲一遍。
lines:
  jiahui:
    - 种姓靠血统锁人，科举把锁撬开了，所以咱们没走那条路。
    - 冲天香阵透长安，满城尽带黄金甲——这句我抄进笔记了。
  yuchen:
    - 当了啊，国号大齐，不过大概只撑了四年。
    - 科举把人从血统里拔出来，世家才锁不死。
  dani:
    - 杀那么多人里也有孩子，听着难受；榜和大旱先把他逼到墙角。
    - 没有种姓锁死谁，谁都能试着往上爬，我觉得公平一点。
  limo:
    - 称了帝。四年没了。就这样。
    - 科举撕开了血统。拳头比字沉。
  chenxue:
    - 种姓锁不住人，科举把路撕开了，这才像骨气。
    - 黄巢称了帝，可大齐没撑住——站哪边我自己想。
  shanyu:
    - 问清楚再离开。事实先说准。
    - 聊得热闹。聊完，心别跑。
