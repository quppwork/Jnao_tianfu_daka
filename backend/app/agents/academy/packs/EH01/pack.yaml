id: EH01
title: 历史课·黄巢篇
topic: 博物馆 · 满城尽带黄金甲
task: 记住今天这节历史课
duration_label: 正片约 5:20
poster: /static/dayu/assets/hall/think1.png
oss_key: AIshipin/EH01_huangchao_720p.mp4
switchable: true
chips:
  - 中国为什么没有种姓？
  - 黄巢最后当上皇帝了吗？
  - 他杀那么多人，你怎么看？
  - 那首诗你记住哪一句？
sense:
  yuchen: 博物馆里我盯着画问：黄巢最后当上皇帝了没有。老师说称帝四年就没了。
  dani: 他杀那么多人，里面也有孩子。老师说是榜和大旱先把他逼到墙角。
  limo: 听到杀遍贵族，我的手自己握紧了。诗我没抄，拳头记得。
  jiahui: 我把那首诗抄进笔记：冲天香阵透长安，满城尽带黄金甲。
  chenxue: 我问种姓，又问他不杀绝会不会被报仇。老师把油画点成民族的骨气。
  shanyu: 历史课是张宇在讲。我在讨论里听他们问完，不替院长重讲一遍。
lines:
  jiahui:
    - 我把那首诗抄进笔记：冲天香阵透长安，满城尽带黄金甲。
    - 种姓那面墙，我先把名字和顺序记下来了。
  yuchen:
    - 我盯着画问：黄巢最后当上皇帝了没有。老师说称帝四年就没了。
    - 榜上没有名字的时候，人会把整张榜烧掉吗？
  dani:
    - 他杀那么多人，里面也有孩子。老师说是榜和大旱先把他逼到墙角。
    - 听完我有点难受，但还想听完。
  limo:
    - 听到杀遍贵族，我的手自己握紧了。诗我没抄，拳头记得。
    - 油画里的甲，比字更沉。
  chenxue:
    - 中国为什么没有种姓？不赶尽杀绝，世家后代会不会报仇？
    - 这堂课不像讲故事，像在问我们站哪边。
  shanyu:
    - 历史课听完了。问完再离开。
    - 聊得热闹。聊完，心别跑。
danmaku:
  - 满城尽带黄金甲
  - 种姓？
  - 称帝四年
  - 那张榜…
plot:
  can_talk: 博物馆、种姓、黄巢、诗句、自己问过或听过的那一句
  cannot_know: 地宫闯关、把杀戮当榜样
  teacher: 张宇
fit:
  must_have: [黄巢, 种姓, 博物馆, 黄金甲]
  must_not_alone: [站桩, 眼罩, 标准桩]
