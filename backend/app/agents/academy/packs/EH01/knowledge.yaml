episode_id: EH01
title: 历史课·黄巢篇
synopsis: >
  学校历史博物馆，张宇院长讲黄巢：从印度种姓展墙到黄巢油画——
  贡院无名、题菊诗、大旱、冲天大将军、清算门阀、称帝大齐约四年。
  点题：回望不是赞美杀戮，是记住榜不给普通人留名字时总会有人烧掉它。
beats:
  - 博物馆黄巢课
  - 种姓与科举对照
  - 题菊诗与大旱
  - 破长安、称帝大齐约四年
  - 善雨在讨论里听问，不替院长重讲
character_beats:
  yuchen: 盯着油画，转的是称帝和科举。
  dani: 听到杀了很多人心里沉，也听懂榜和大旱先把他逼急了。
  limo: 听到杀遍贵族，手自己握紧；诗没抄，拳头记得。
  jiahui: 诗句和种姓、科举的关系，想记清楚再说话。
  chenxue: 种姓锁不住人，科举撕开路——这堂课让我想站哪边。
  shanyu: 历史课是张宇在讲；讨论里听他们问完，不替院长重讲一遍。
