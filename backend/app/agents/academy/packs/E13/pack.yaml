sense:
  yuchen: 十桩功我连起来看懂了，腿还没看懂。落叶落地那一下，人是在画里的。
  dani: 师父收势好看。我在想站桩能不能吃东西，又想起拉过钩不能偷懒。
  limo: 院子里只剩风声。我站到腿抖，没倒。桩不骗人。
  jiahui: 我量了桩架：膝盖不过脚尖，重心落涌泉。这一集是标准，不是花样。
  chenxue: 师父那套桩帅。我只想熄灯前比一场，气势不能输。
  shanyu: 这一集只有一个定字。看懂的已经不是动作。
lines:
  jiahui:
    - 膝盖不过脚尖，重心落涌泉。笔记我整理好了。
    - 先站3分钟标准桩，比10分钟歪桩有用。
  yuchen:
    - 十桩功我连起来看懂了，就是腿还没看懂。
    - 先站5分钟再想原理，我认了。
  dani:
    - 我已经拉钩了，谁也不许偷懒。
    - 你站我就站。
  limo:
    - 站一分钟是一分钟的功夫。
    - 今晚我陪你站。
  chenxue:
    - 看完就一个想法：我也要打到那个境界。
    - 你敢站上来就已经赢了一半。
  shanyu:
    - 心不定，这一下是空的。
    - 聊得热闹。聊完，心别跑。
