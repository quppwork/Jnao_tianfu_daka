    - { skill: 扫描速记, mark: "不推荐" }
  senior:
    - { skill: 扫描速记, mark: "不推荐" }

# ══════════════════════════════════════════════════
# 九、轮换序（Phase: round_robin_fill）
# ══════════════════════════════════════════════════

tier_skills_order:
  tier_1: [A, B]
  tier_2: [A, B, C]
  tier_3: [B, C, D, E, A]
  tier_4: [B, C, D, E]
  tier_5: [F, G, B, C, D, E]
