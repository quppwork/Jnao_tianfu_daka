      skills: [多元感知, 极速运算]
      cost_slots: 2
    - id: B2
      skills: [扫描速记, 极速运算]
      cost_slots: 2
      grade_note:
        junior: "不推荐"
        senior: "不推荐"
    - id: B3
      skills: [影像追忆, 极速运算]
      cost_slots: 2
    - id: B4
      skills: [极速运算, 极速学习]
      cost_slots: 3
      min_total_slots: 3
  tier_4: []
  tier_5: []
  tier_6: []

