# 训练推课体系 — 业务规则 v3.0
# 架构：Decision Tree + Strategy Pipeline
# 加载：config.loader.load_training_curriculum()

version: 3

# ══════════════════════════════════════════════════
# 一、技能定义
# ══════════════════════════════════════════════════

skills:
  required:
    - 超脑阅读    # A — 单音频，无 OSS stage，各 Tier 复用
    - 影像追忆    # B — OSS stage 1-5
    - 扫描速记    # C — OSS stage 1-5，Tier 1 练但不考
    - 极速运算    # D — OSS stage 2-5，Tier 3 开始出现
    - 极速学习    # E — OSS stage 2/3-5（起点因天赋而异），Tier 4 开始考核
    - 文科奥秘    # F — Tier 5 引入
    - 理科奥秘    # G — Tier 5 引入
    - 天赋绘画    # H — Tier 6 引入
    - 音乐灵感    # I — Tier 6 引入

  elective:
    - 精力恢复    # 训练时长 ≥ 8h 时弹出，无打卡
    - 多元感知    # 可打可不打，有打卡按钮+卡片
    - 高效作业    # 不打卡，播放音频即可

# ══════════════════════════════════════════════════
# 二、选修技能行为规则
# ══════════════════════════════════════════════════

elective_rules:
  精力恢复:
    trigger: duration_gte_8h
    has_checkin: false
    blocks_next: false
    display_order: after_required

  多元感知:
    trigger: manual
    has_checkin: true
    checkin_fields: [card_count, accuracy_pct]
    blocks_next: false

  高效作业:
    trigger: formula_slot
    has_checkin: false
    blocks_next: false
    skip_carryover: true

# ══════════════════════════════════════════════════
# 三、Decision Tree（策略选择）
# ══════════════════════════════════════════════════

decision_tree:
  root: check_consecutive_14

  nodes:
    # ── 连续 14 天 ≤20min → 强制升级 ──
    check_consecutive_14:
      type: condition
      predicate: consecutive_days_short
      params: { min_days: 14, max_minutes: 20 }
      on_true: force_upgrade
      on_false: check_consecutive_7

    # ── 连续 7 天 ≤20min → 轮换排课 ──
    check_consecutive_7:
      type: condition
      predicate: consecutive_days_short
      params: { min_days: 7, max_minutes: 20 }
      on_true: compensate_diversity
      on_false: check_tier_bundle

    # ── Tier 3 → 捆绑排课 ──
    check_tier_bundle:
      type: condition
      predicate: tier_in
      params: { tiers: [3] }
      on_true: weight_with_bundle
      on_false: normal_weight

    # ── 策略叶子 ──
    force_upgrade:
      type: strategy
      strategy: forced_upgrade
      params:
        min_minutes: 40
        reason: "已连续 14 天选择 20 分钟，自动升级时长以保证训练效果"

    compensate_diversity:
      type: strategy
      strategy: diversity_round_robin
      params:
        reason: "连续 7 天短时训练，启用轮换排课保持内容多样性"

    weight_with_bundle:
      type: strategy
      strategy: weight_with_bundle

    normal_weight:
      type: strategy
      strategy: weight_based

# ══════════════════════════════════════════════════
# 四、槽位表（§3）
# ══════════════════════════════════════════════════

slot_table:
  - minutes: 20
    slots: 1
  - minutes: 40
    slots: 2
  - minutes: [60, 120]
    slots: 3
  - minutes: [121, 180]
    slots: 4
    homework:
      tier_1: { skill: 高效作业, count: 1 }
      tier_2: { skill: 高效作业, count: 1 }
      tier_3: { skill: 极速学习, count: 1 }
      tier_4: { skill: 极速学习, count: 1 }
      tier_5: { skill: 极速学习, count: 1 }
      tier_6: { skill: 极速学习, count: 1 }
    exam_note: "建议准备2套以上试卷"
  - minutes: [181, 240]
    slots: 4
    homework:
      tier_1: { skill: 高效作业, count: 1 }
      tier_2: { skill: 高效作业, count: 1 }
      tier_3: { skill: 极速学习, count: 2 }
      tier_4: { skill: 极速学习, count: 2 }
      tier_5: { skill: 极速学习, count: 2 }
      tier_6: { skill: 极速学习, count: 2 }
    exam_note: "建议准备3套以上试卷"
  - minutes: [241, 300]
    slots: 5
    homework:
      tier_1: { skill: 高效作业, count: 1 }
      tier_2: { skill: 高效作业, count: 1 }
      tier_3: { skill: 极速学习, count: 3 }
      tier_4: { skill: 极速学习, count: 3 }
      tier_5: { skill: 极速学习, count: 3 }
      tier_6: { skill: 极速学习, count: 3 }
    exam_note: "建议准备4套以上试卷"
  - minutes: [480, 9999]
    slots: 6
    homework:
      tier_1: { skill: 高效作业, count: 1 }
      tier_2: { skill: 高效作业, count: 1 }
      tier_3: { skill: 极速学习, count: 3 }
      tier_4: { skill: 极速学习, count: 3 }
      tier_5: { skill: 极速学习, count: 3 }
      tier_6: { skill: 极速学习, count: 3 }

# ══════════════════════════════════════════════════
# 五、各阶可用技能 + 权重（§4）
# ══════════════════════════════════════════════════

tier_skills:
  tier_1: [A, B, C, D, E]
  tier_2: [A, B, C, D, E]
  tier_3: [A, B, C, D, E]
  tier_4: [A, B, C, D, E]
  tier_5: [A, B, C, D, E, F, G]
  tier_6: [B, C, D, H, I]

tier_weights:
  tier_1: { A: 0.40, B: 0.35, C: 0.12, D: 0.08, E: 0.05 }
  tier_2: { A: 0.25, B: 0.35, C: 0.25, D: 0.10, E: 0.05 }
  tier_3: { A: 0.05, B: 0.30, C: 0.28, D: 0.22, E: 0.15 }
  tier_4: { A: 0.03, B: 0.28, C: 0.26, D: 0.23, E: 0.20 }
  tier_5: { A: 0.02, B: 0.18, C: 0.16, D: 0.14, E: 0.10, F: 0.20, G: 0.20 }
  tier_6: { B: 0.22, C: 0.18, D: 0.16, H: 0.22, I: 0.22 }

# ══════════════════════════════════════════════════
# 六、衰减规则（§5）
# ══════════════════════════════════════════════════

decay_rules:
  key_skills:
    tier_1: [A, B]
    tier_2: [A, B, C]
    tier_3: [B, C, D, E]
    tier_4: [B, C, D, E]
    tier_5: [A, B, C, D, E, F, G]
    tier_6: [B, C, D, H, I]
  secondary_skills:
    tier_1: [C, D, E]
    tier_2: [D, E]
    tier_3: [A]
    tier_4: [A]
    tier_5: [A]
    tier_6: []
  factors:
    key: 0.7
    secondary: 0.5
  threshold: 0.01

# ══════════════════════════════════════════════════
# 七、捆绑配置（§8）
# ══════════════════════════════════════════════════

