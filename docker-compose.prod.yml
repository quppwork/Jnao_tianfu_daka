# 宝塔 / 阿里云生产部署（使用已有 RDS MySQL）
# 用法: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# 若需 Docker 内置 MySQL，改用:
# docker compose -f docker-compose.prod.yml -f docker-compose.prod.mysql.yml --env-file .env.production up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: jnao-daka-backend:latest
    container_name: jnao-daka-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
      - ./docs/data:/catalog_data:ro
      - ./docs/export/qywx_follow_mobile.csv:/app/data/qywx_export/qywx_follow_mobile.csv:ro
    env_file:
      - .env.production
    environment:
      JNAO_HOST: 0.0.0.0
      JNAO_PORT: "8012"
      TZ: Asia/Shanghai
      JNAO_ENV: production
      JNAO_DEV_MODE: "0"
      JNAO_DEBUG_ROUTES: "0"
      TIANFU_RAG_MOCK: ${TIANFU_RAG_MOCK:-1}
      TIANFU_RAG_URL: ${TIANFU_RAG_URL:-}
      # 百炼引导页 RAG（Retrieve → 豆包）；也可只写在 .env.production，由 env_file 注入
      BAILIAN_WORKSPACE_ID: ${BAILIAN_WORKSPACE_ID:-}
      BAILIAN_API_HOST: ${BAILIAN_API_HOST:-}
      BAILIAN_INDEX_ID: ${BAILIAN_INDEX_ID:-}
      GUIDE_RAG_ENABLED: ${GUIDE_RAG_ENABLED:-0}
      GUIDE_RAG_MODE: ${GUIDE_RAG_MODE:-retrieve}
      BAILIAN_RAG_GENERATE: ${BAILIAN_RAG_GENERATE:-0}
      BAILIAN_GENERATE_MODEL: ${BAILIAN_GENERATE_MODEL:-qwen3.8-max}
      BAILIAN_GENERATE_TIMEOUT: ${BAILIAN_GENERATE_TIMEOUT:-25}
      BAILIAN_RAG_FALLBACK_DOUBAO: ${BAILIAN_RAG_FALLBACK_DOUBAO:-1}
      BAILIAN_VIDEO_INDEX_ID: ${BAILIAN_VIDEO_INDEX_ID:-}
      TRAINING_RAG_ENABLED: ${TRAINING_RAG_ENABLED:-0}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      BAILIAN_AGENT_ID: ${BAILIAN_AGENT_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-}
      QA_SESSION_CACHE_TTL: ${QA_SESSION_CACHE_TTL:-3600}
      CACHE_TTL_PROFILE: ${CACHE_TTL_PROFILE:-300}
      CACHE_TTL_ASSESSMENT: ${CACHE_TTL_ASSESSMENT:-600}
      CACHE_TTL_TRAINING_TODAY: ${CACHE_TTL_TRAINING_TODAY:-30}
      CACHE_TTL_TRAINING_PROGRESS: ${CACHE_TTL_TRAINING_PROGRESS:-60}
      CACHE_TTL_GROWTH_SUMMARY: ${CACHE_TTL_GROWTH_SUMMARY:-120}
      CACHE_TTL_ACHIEVEMENT: ${CACHE_TTL_ACHIEVEMENT:-60}
      CACHE_TTL_GUIDE_BOOTSTRAP: ${CACHE_TTL_GUIDE_BOOTSTRAP:-86400}
      CORS_ORIGINS: ${SITE_DOMAIN}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY}
      DOUBAO_API_BASE: ${DOUBAO_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      DOUBAO_CHAT_MODEL: ${DOUBAO_CHAT_MODEL:-doubao-seed-1-6-250615}
      DOUBAO_VISION_MODEL: ${DOUBAO_VISION_MODEL:-doubao-seed-1-6-250615}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-jnao-talent-ai}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_PREFIX: ${OSS_PREFIX:-yinpin/}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_MEDIA_DIRECT_REDIRECT: ${OSS_MEDIA_DIRECT_REDIRECT:-1}
      OSS_MEDIA_SAME_ORIGIN_CACHE: ${OSS_MEDIA_SAME_ORIGIN_CACHE:-}
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      SPEECH_APP_ID: ${SPEECH_APP_ID:-}
      SPEECH_ACCESS_TOKEN: ${SPEECH_ACCESS_TOKEN:-}
      CATALOG_DATA_DIR: /catalog_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/api/ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - jnao_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: jnao-daka-frontend:latest
    container_name: jnao-daka-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5185}:80"
    environment:
      OSS_BUCKET: ${OSS_BUCKET:-jnao-talent-ai}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
    volumes:
      - nginx_media_cache:/var/cache/nginx/media
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jnao_net

volumes:
  backend_data:
  nginx_media_cache:

networks:
  jnao_net:
    driver: bridge
