# 宝塔 / 阿里云生产部署（使用已有 RDS MySQL）
# 用法: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# 若需 Docker 内置 MySQL，改用:
# docker compose -f docker-compose.prod.yml -f docker-compose.prod.mysql.yml --env-file .env.production up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: jnao-daka-backend:latest
    container_name: jnao-daka-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
      - ./docs/data:/catalog_data:ro
      - ./docs/export/qywx_follow_mobile.csv:/app/data/qywx_export/qywx_follow_mobile.csv:ro
    env_file:
      - .env.production
    environment:
      # 只放容器运行时必须覆盖的项。密钥/百炼 aid 一律走 env_file。
      # 切勿在此写 ${DASHSCOPE_API_KEY:-} 这类空默认：compose 插值失败会写成空串，
      # 从而覆盖 env_file，KB Agent 被关掉，引导页会退化成豆包+天赋报告。
      JNAO_HOST: 0.0.0.0
      JNAO_PORT: "8012"
      TZ: Asia/Shanghai
      CATALOG_DATA_DIR: /catalog_data
      CORS_ORIGINS: ${SITE_DOMAIN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/api/ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - jnao_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: jnao-daka-frontend:latest
    container_name: jnao-daka-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5185}:80"
    environment:
      OSS_BUCKET: ${OSS_BUCKET:-jnao-talent-ai}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
    volumes:
      - nginx_media_cache:/var/cache/nginx/media
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jnao_net

volumes:
  backend_data:
  nginx_media_cache:

networks:
  jnao_net:
    driver: bridge
