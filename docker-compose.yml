services:
  backend:
    build:
      context: ./backend
    image: jnao-daka-backend:local
    container_name: jnao-daka-backend
    ports:
      - "8012:8012"
    volumes:
      - backend_data:/app/data
    environment:
      JNAO_HOST: 0.0.0.0
      JNAO_PORT: "8012"
      DATABASE_URL: sqlite:///./data/jnao_daka.db
      TIANFU_RAG_MOCK: "1"
      CORS_ORIGINS: http://localhost:5185,http://127.0.0.1:5185
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: jnao-daka-frontend:local
    container_name: jnao-daka-frontend
    ports:
      - "5185:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 可选沙箱镜像：docker compose --profile harness build harness-sandbox
  # 默认 HARNESS_SANDBOX=local。禁止把 /var/run/docker.sock 挂进 backend 或沙箱。
  harness-sandbox:
    profiles: ["harness"]
    build:
      context: .
      dockerfile: docker/Dockerfile.harness-sandbox
    image: jnao-harness-sandbox:local
    command: ["python", "-c", "print('jnao-harness-sandbox image ok')"]

volumes:
  backend_data:
